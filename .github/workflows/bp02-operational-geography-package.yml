name: BP02 Operational Geography Package — PostgreSQL 18.7 Source Validation

on:
  push:
    branches: [main]
    paths:
      - "runtime/bp02_operational_geography_package.py"
      - "runtime/bp02_operational_geography_importer.py"
      - "runtime/bp02_full_acceptance_audit.py"
      - "runtime/bp02_fictional_geography_release.py"
      - "runtime/parcel_candidate_generator.py"
      - "runtime/parcel_dossier_generator.py"
      - "runtime/physical_asset_inventory_generator.py"
      - "runtime/bp02_parcel_address_identity.py"
      - "runtime/bp02_address_frontage_exception_resolution.py"
      - "runtime/bp02_bridge_connector_engineering_register.py"
      - "db/domain-migrations/bp02/**"
      - "scripts/migrate_bp02.py"
      - "data/geography/**"
      - "data/property/saltwater-property-world-v1.json.gz"
      - ".github/workflows/bp02-operational-geography-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-operational-geography-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_USER: saltwater_test
          POSTGRES_DB: saltwater_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saltwater_test -d saltwater_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://saltwater_test:test-only@localhost:5432/saltwater_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned geometry engine and PostgreSQL driver
        run: python -m pip install "shapely==2.1.2" "psycopg[binary]>=3.2,<4"
      - name: Record clean PostgreSQL baseline
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              print("postgres_version=" + conn.execute("SHOW server_version").fetchone()[0])
              print("database_bytes_before=" + str(conn.execute("SELECT pg_database_size(current_database())").fetchone()[0]))
          PY
      - name: Measure incremental 0002 schema storage over existing 0001 foundation
        run: |
          python - <<'PY'
          import os, psycopg
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from migrate_bp02 import migration_plan, _migration_body
          plan = migration_plan()
          assert len(plan) == 2 and plan[0]["migration_name"] == "0001_source_archive" and plan[1]["migration_name"] == "0002_operational_geography"
          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as conn:
              with conn.transaction():
                  conn.execute(_migration_body(plan[0]["path"]))
                  conn.execute("INSERT INTO sw_geo.bp02_schema_migration(version,migration_name,checksum_sha256) VALUES (%s,%s,%s)", (1, plan[0]["migration_name"], plan[0]["checksum_sha256"]))
              after_0001 = conn.execute("SELECT pg_database_size(current_database())").fetchone()[0]
              with conn.transaction():
                  conn.execute(_migration_body(plan[1]["path"]))
                  conn.execute("INSERT INTO sw_geo.bp02_schema_migration(version,migration_name,checksum_sha256) VALUES (%s,%s,%s)", (2, plan[1]["migration_name"], plan[1]["checksum_sha256"]))
              after_0002 = conn.execute("SELECT pg_database_size(current_database())").fetchone()[0]
              print(f"schema_bytes_after_0001={after_0001}")
              print(f"schema_bytes_after_0002={after_0002}")
              print(f"incremental_0002_schema_growth_bytes={after_0002-after_0001}")
          PY
      - name: Run BP02 acceptance once and build the package
        run: python -m runtime.bp02_operational_geography_package
      - name: Verify package and manifest integrity
        run: |
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          package = Path("build/bp02-operational-geography-v1.json.gz").read_bytes()
          manifest = json.loads(Path("build/bp02-operational-geography-v1.manifest.json").read_text())
          assert len(package) == manifest["compressed_bytes"]
          assert hashlib.sha256(package).hexdigest() == manifest["package_sha256"]
          raw = gzip.decompress(package)
          assert len(raw) == manifest["uncompressed_bytes"]
          payload = json.loads(raw)
          assert payload["acceptance"]["overall_status"] == "PASS"
          assert payload["database_write_performed"] is False
          print(json.dumps({
              "compressed_bytes": len(package),
              "uncompressed_bytes": len(raw),
              "package_sha256": manifest["package_sha256"],
              "source_hashes": manifest["source_hashes"],
              "record_counts": manifest["record_counts"],
              "production_database_written": False
          }, indent=2, sort_keys=True))
          PY
      - name: Apply BP02 domain schema in disposable PostgreSQL
        run: python scripts/migrate_bp02.py --apply --expected-database saltwater_test
      - name: Import accepted gameplay geography and measure storage
        run: |
          python -m runtime.bp02_operational_geography_importer --apply --expected-database saltwater_test
          python - <<'PY'
          import os, psycopg
          tables = {
              "districts":"bp02_district", "neighbourhoods":"bp02_neighbourhood",
              "features":"bp02_feature", "roads":"bp02_road", "nodes":"bp02_node",
              "segments":"bp02_segment", "routes":"bp02_route", "route_nodes":"bp02_route_node",
              "route_segments":"bp02_route_segment", "parcels":"bp02_parcel",
              "addresses":"bp02_address", "access_points":"bp02_access_point",
              "bridge_connectors":"bp02_bridge_connector",
          }
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              for label, table in tables.items():
                  count = conn.execute(f"SELECT count(*) FROM sw_geo.{table}").fetchone()[0]
                  print(f"{label}_rows={count}")
              print("database_bytes_after_import=" + str(conn.execute("SELECT pg_database_size(current_database())").fetchone()[0]))
              print("release_record=" + str(conn.execute("SELECT release_id,package_sha256,production_seed_approved FROM sw_geo.bp02_release").fetchone()))
              assert conn.execute("SELECT count(*) FROM sw_geo.bp02_segment s JOIN sw_geo.bp02_node n ON n.source_id=s.from_node_source_id JOIN sw_geo.bp02_node t ON t.source_id=s.to_node_source_id JOIN sw_geo.bp02_road r ON r.source_id=s.road_source_id").fetchone()[0] == 685
              assert conn.execute("SELECT count(*) FROM sw_geo.bp02_address a JOIN sw_geo.bp02_parcel p ON p.source_id=a.parcel_source_id").fetchone()[0] == 420
              assert conn.execute("SELECT count(*) FROM sw_geo.bp02_bridge_connector WHERE operational_status='ACTIVE_IN_GAME'").fetchone()[0] == 4
          PY
      - name: Verify idempotent repeat import has zero growth
        run: |
          before=$(python -c 'import os,psycopg; c=psycopg.connect(os.environ["DATABASE_URL"]); print(c.execute("SELECT pg_database_size(current_database())").fetchone()[0]); c.close()')
          python -m runtime.bp02_operational_geography_importer --apply --expected-database saltwater_test
          after=$(python -c 'import os,psycopg; c=psycopg.connect(os.environ["DATABASE_URL"]); print(c.execute("SELECT pg_database_size(current_database())").fetchone()[0]); c.close()')
          echo "database_bytes_before_repeat=$before"
          echo "database_bytes_after_repeat=$after"
          echo "repeat_import_growth_bytes=$((after-before))"
          test "$before" = "$after"
      - name: Upload measured package and manifest
        uses: actions/upload-artifact@v4
        with:
          name: bp02-operational-geography-v1-package
          path: |
            build/bp02-operational-geography-v1.json.gz
            build/bp02-operational-geography-v1.manifest.json
          if-no-files-found: error
          retention-days: 30
