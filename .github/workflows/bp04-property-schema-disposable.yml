name: BP04 canonical property stack — 100-table disposable PostgreSQL 16/18 benchmark
# Keep the archive-only collection inventory assertion aligned with the expanded source stack.

on:
  push:
    branches: ["main"]
    paths:
      - "db/migrations/0003_bp04_compressed_source_archive.sql"
      - "db/migrations/0004_bp04_building_services_utilities.sql"
      - "db/migrations/0005_bp04_property_maintenance_repairs.sql"
      - "db/migrations/0006_bp04_property_security_access.sql"
      - "db/migrations/0007_bp04_property_valuation_tax.sql"
      - "db/migrations/0008_bp04_source_collection_mapping.sql"
      - "db/migrations/0009_bp04_business_operating_schedules.sql"
      - "db/migrations/0010_bp04_lawful_use_building_control.sql"
      - "db/migrations/0011_bp04_property_title_lifecycle.sql"
      - "db/migrations/0012_bp04_property_rights_boundaries.sql"
      - "db/migrations/0013_bp04_agreement_event_history.sql"
      - "db/migrations/0014_bp04_agreement_lifecycle_transitions.sql"
      - "db/migrations/0015_bp04_subletting_occupancy_relationships.sql"
      - "db/migrations/0016_bp04_agreement_assignment.sql"
      - "db/migrations/0017_bp04_property_ownership_transfer_writer.sql"
      - "db/migrations/0018_bp04_occupancy_handover.sql"
      - "db/migrations/0019_bp04_subletting_idempotency_race_fix.sql"
      - "db/migrations/0020_bp04_subletting_handover_serialization.sql"
      - "db/migrations/0021_bp04_effective_dated_joint_ownership_interests.sql"
      - "db/migrations/0022_bp04_occupancy_dispute_register.sql"
      - "db/migrations/0023_bp04_joint_title_transfer_writer.sql"
      - "db/migrations/0024_bp04_contractual_right_consent_lifecycle.sql"
      - "db/migrations/0025_bp04_subletting_end_start_serialization.sql"
      - "tests/pkg001/bp04_agreement_event_history_acceptance.sql"
      - "tests/pkg001/bp04_ownership_interest_acceptance.sql"
      - "tests/pkg001/bp04_occupancy_dispute_acceptance.sql"
      - "tests/pkg001/bp04_joint_title_transfer_acceptance.sql"
      - "tests/pkg001/test_bp04_concurrent_handover.py"
      - "tests/pkg001/test_bp04_subletting_lifecycle_concurrency.py"
      - "tests/pkg001/bp04_business_search_performance.py"
      - "runtime/bp04_property_stack_importer.py"
      - "tests/pkg001/bp04_property_schema_acceptance.sql"
      - "tests/pkg001/test_bp04_property_stack_importer.py"
      - "runtime/bp04_archive_reader.py"
      - "tests/pkg001/test_bp04_archive_reader.py"
      - "runtime/bp04_lookup.py"
      - "tests/pkg001/test_bp04_lookup.py"
      - "tests/pkg001/test_bp04_lookup_archives.py"
      - "tests/pkg001/test_bp04_player_commands_archives.py"
      - "tests/pkg001/bp04_archive_only_acceptance.sql"
      - "tests/pkg001/bp04_property_import_acceptance.sql"
      - ".github/workflows/bp04-property-schema-disposable.yml"
      - "data/property/saltwater-property-world-v1.json.gz"
      - "data/property/saltwater-property-tenure-v1.json.gz"
      - "data/business/saltwater-business-registry-v1.json.gz"
      - "data/property/saltwater-building-services-v1.json.gz"
      - "data/property/saltwater-property-maintenance-v1.json.gz"
      - "data/property/saltwater-property-security-access-v1.json.gz"
      - "data/property/saltwater-property-value-risk-tax-v1.json.gz"
      - "data/business/saltwater-business-operations-v1.json.gz"
      - "data/property/saltwater-property-development-control-v1.json.gz"
      - "data/property/saltwater-property-facilities-operations-v1.json.gz"
      - "data/property/saltwater-property-insurance-claims-v1.json.gz"
      - "data/property/saltwater-property-lifecycle-transactions-v1.json.gz"
      - "data/property/saltwater-property-rights-boundaries-v1.json.gz"
      - "data/property/saltwater-global-estate-capacity-audit-v1.json.gz"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-and-import:
    name: schema-and-import (PostgreSQL ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: saltwater_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: saltwater_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saltwater_test -d saltwater_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://saltwater_test:test-only@localhost:5432/saltwater_test
      PGPASSWORD: test-only
      PGUSER: saltwater_test
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: saltwater_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install importer driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Apply foundation and BP04 production migrations through the production migration runner
        run: python scripts/migrate.py --apply
      - name: Verify source collection identity and archive reader
        run: python -m unittest tests.pkg001.test_bp04_property_stack_importer tests.pkg001.test_bp04_archive_reader tests.pkg001.test_bp04_lookup -v
      - name: Verify explicit production importer guard
        run: |
          python runtime/bp04_property_stack_importer.py --help
          if python runtime/bp04_property_stack_importer.py --dsn "postgresql://unused:unused@localhost/neondb" --expected-database neondb >/tmp/bp04-prod-guard.log 2>&1; then
            echo "ERROR: production import was allowed without --allow-production"
            exit 1
          fi
          grep -q "pass --allow-production explicitly" /tmp/bp04-prod-guard.log
          if python runtime/bp04_property_stack_importer.py --dsn "postgresql://unused:unused@localhost/saltwater_test" --expected-database saltwater_test --allow-production >/tmp/bp04-prod-target.log 2>&1; then
            echo "ERROR: --allow-production accepted a non-production database target"
            exit 1
          fi
          grep -q "valid only with --expected-database neondb" /tmp/bp04-prod-target.log
          if python runtime/bp04_property_stack_importer.py --dsn "postgresql://unused:unused@localhost/neondb" --expected-database neondb --allow-production --typed-relational >/tmp/bp04-prod-storage.log 2>&1; then
            echo "ERROR: production accepted typed-relational storage mode"
            exit 1
          fi
          grep -q "Production Neon imports are restricted to --archive-only mode" /tmp/bp04-prod-storage.log
      - name: Verify 100-table typed inventory and integrity contracts
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp04_property_schema_acceptance.sql
      - name: Verify agreement event history and lifecycle transition writer
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp04_agreement_event_history_acceptance.sql
      - name: Verify joint, disputed and time-bounded ownership interests
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp04_ownership_interest_acceptance.sql
      - name: Verify occupancy entitlement and consent dispute lifecycle
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp04_occupancy_dispute_acceptance.sql
      - name: Verify coordinated joint-title transfer and continuing occupancy
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp04_joint_title_transfer_acceptance.sql
      - name: Verify concurrent occupancy handover serialization and idempotency
        run: python tests/pkg001/test_bp04_concurrent_handover.py
      - name: Verify subletting start/end interleavings under real concurrent sessions
        run: python -m unittest tests.pkg001.test_bp04_subletting_lifecycle_concurrency -v
      - name: Benchmark 10k business substring search latency
        run: python tests/pkg001/bp04_business_search_performance.py
      - name: Store all 14 compressed source datasets without typed-row expansion
        run: python runtime/bp04_property_stack_importer.py --root . --dsn "$DATABASE_URL" --archive-only
      - name: Verify archive-only storage and complete provenance
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp04_archive_only_acceptance.sql
      - name: Verify gameplay lookup against the actual imported BP04 archives
        run: python -m unittest tests.pkg001.test_bp04_lookup_archives -v
      - name: Verify player find and inspect commands against real BP04 archives
        run: python -m unittest tests.pkg001.test_bp04_player_commands_archives -v
      - name: Verify second import is idempotent and storage-stable
        run: |
          BEFORE="$(psql -At -v ON_ERROR_STOP=1 -c "SELECT pg_database_size(current_database());")"
          psql -v ON_ERROR_STOP=1 -c "SELECT pg_stat_reset();"
          python runtime/bp04_property_stack_importer.py --root . --dsn "$DATABASE_URL" --archive-only
          AFTER="$(psql -At -v ON_ERROR_STOP=1 -c "SELECT pg_database_size(current_database());")"
          echo "database_bytes_before=$BEFORE"
          echo "database_bytes_after=$AFTER"
          echo "repeat_import_table_mutations:"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname, n_tup_ins, n_tup_upd, n_tup_del FROM pg_stat_user_tables WHERE schemaname='sw_property' AND (n_tup_ins+n_tup_upd+n_tup_del)>0 ORDER BY (n_tup_ins+n_tup_upd+n_tup_del) DESC, relname;"
          echo "largest_relation_sizes_after_repeat:"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname, pg_total_relation_size(relid) AS total_bytes FROM pg_stat_user_tables WHERE schemaname='sw_property' ORDER BY total_bytes DESC LIMIT 12;"
          test "$BEFORE" = "$AFTER"
      - name: Report disposable PostgreSQL storage and archive relation size
        run: |
          psql -v ON_ERROR_STOP=1 -c "SELECT pg_database_size(current_database()) AS disposable_database_bytes;"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname, pg_total_relation_size(relid) AS total_bytes FROM pg_stat_user_tables WHERE schemaname='sw_property' ORDER BY total_bytes DESC;"
