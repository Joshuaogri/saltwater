name: BP04 canonical property schema — disposable PostgreSQL 16

on:
  push:
    branches: ["main"]
    paths:
      - "db/proposals/0013_bp04_compressed_source_archive.sql"
      - "db/proposals/0014_bp04_building_services_utilities.sql"
      - "db/proposals/0015_bp04_property_maintenance_repairs.sql"
      - "db/proposals/0016_bp04_property_security_access.sql"
      - "db/proposals/0017_bp04_property_valuation_tax.sql"
      - "db/proposals/0018_bp04_source_collection_mapping.sql"
      - "db/proposals/0019_bp04_business_operating_schedules.sql"
      - "db/proposals/0020_bp04_lawful_use_building_control.sql"
      - "runtime/bp04_property_stack_importer.py"
      - "tests/pkg001/bp04_property_schema_acceptance.sql"
      - "tests/pkg001/test_bp04_property_stack_importer.py"
      - "tests/pkg001/bp04_property_import_acceptance.sql"
      - ".github/workflows/bp04-property-schema-disposable.yml"
      - "data/property/saltwater-property-world-v1.json.gz"
      - "data/property/saltwater-property-tenure-v1.json.gz"
      - "data/business/saltwater-business-registry-v1.json.gz"
      - "data/property/saltwater-building-services-v1.json.gz"
      - "data/property/saltwater-property-maintenance-v1.json.gz"
      - "data/property/saltwater-property-security-access-v1.json.gz"
      - "data/property/saltwater-property-value-risk-tax-v1.json.gz"
      - "data/business/saltwater-business-operations-v1.json.gz"
      - "data/property/saltwater-property-development-control-v1.json.gz"
      - "data/property/saltwater-property-facilities-operations-v1.json.gz"
      - "data/property/saltwater-property-insurance-claims-v1.json.gz"
      - "data/property/saltwater-property-lifecycle-transactions-v1.json.gz"
      - "data/property/saltwater-property-rights-boundaries-v1.json.gz"
      - "data/property/saltwater-global-estate-capacity-audit-v1.json.gz"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-and-import:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saltwater_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: saltwater_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saltwater_test -d saltwater_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://saltwater_test:test-only@localhost:5432/saltwater_test
      PGPASSWORD: test-only
      PGUSER: saltwater_test
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: saltwater_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install importer driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Apply BP04 phase-1 proposal to disposable database only
        run: psql -v ON_ERROR_STOP=1 -f db/proposals/0013_bp04_compressed_source_archive.sql
      - name: Apply BP04 phase-2 building services schema to disposable database only
        run: psql -v ON_ERROR_STOP=1 -f db/proposals/0014_bp04_building_services_utilities.sql
      - name: Apply BP04 phase-3 maintenance schema to disposable database only
        run: psql -v ON_ERROR_STOP=1 -f db/proposals/0015_bp04_property_maintenance_repairs.sql
      - name: Apply BP04 phase-4 security and access schema to disposable database only
        run: psql -v ON_ERROR_STOP=1 -f db/proposals/0016_bp04_property_security_access.sql
      - name: Apply BP04 phase-5 valuation and tax schema to disposable database only
        run: psql -v ON_ERROR_STOP=1 -f db/proposals/0017_bp04_property_valuation_tax.sql
      - name: Apply BP04 phase-6 complete source inventory and mapping ledger
        run: psql -v ON_ERROR_STOP=1 -f db/proposals/0018_bp04_source_collection_mapping.sql
      - name: Apply BP04 phase-7 business operating schedules
        run: psql -v ON_ERROR_STOP=1 -f db/proposals/0019_bp04_business_operating_schedules.sql
      - name: Apply BP04 phase-8 lawful-use and building-control schema
        run: psql -v ON_ERROR_STOP=1 -f db/proposals/0020_bp04_lawful_use_building_control.sql
      - name: Verify source collection identity handling
        run: python -m unittest tests.pkg001.test_bp04_property_stack_importer -v
      - name: Verify typed table inventory and integrity contracts
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp04_property_schema_acceptance.sql
      - name: Archive all 14 compressed sources; import mapped property, business, operating schedules, lawful-use, building-control, utility, maintenance, security, valuation and tax collections
        run: python runtime/bp04_property_stack_importer.py --root . --dsn "$DATABASE_URL"
      - name: Verify source collection ledger and business schedule import
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp04_property_import_acceptance.sql
      - name: Verify second import is idempotent and storage-stable
        run: |
          BEFORE="$(psql -At -v ON_ERROR_STOP=1 -c "SELECT pg_database_size(current_database());")"
          psql -v ON_ERROR_STOP=1 -c "SELECT pg_stat_reset();"
          python runtime/bp04_property_stack_importer.py --root . --dsn "$DATABASE_URL"
          AFTER="$(psql -At -v ON_ERROR_STOP=1 -c "SELECT pg_database_size(current_database());")"
          echo "database_bytes_before=$BEFORE"
          echo "database_bytes_after=$AFTER"
          echo "repeat_import_table_mutations:"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname, n_tup_ins, n_tup_upd, n_tup_del FROM pg_stat_user_tables WHERE schemaname='sw_property' AND (n_tup_ins+n_tup_upd+n_tup_del)>0 ORDER BY (n_tup_ins+n_tup_upd+n_tup_del) DESC, relname;"
          echo "largest_relation_sizes_after_repeat:"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname, pg_total_relation_size(relid) AS total_bytes FROM pg_stat_user_tables WHERE schemaname='sw_property' ORDER BY total_bytes DESC LIMIT 12;"
          test "$BEFORE" = "$AFTER"
      - name: Report disposable PostgreSQL storage and table sizes
        run: |
          psql -v ON_ERROR_STOP=1 -c "SELECT pg_database_size(current_database()) AS disposable_database_bytes;"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname, pg_total_relation_size(relid) AS total_bytes FROM pg_stat_user_tables WHERE schemaname='sw_property' ORDER BY total_bytes DESC;"
