name: Saltwater Neon production migration gate

# Deliberately manual and non-deploying. Production migration automation remains
# disabled until the exact baseline-adoption and operation-specific approval
# process is implemented and approved. Repository pushes never connect to Neon.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-deployment-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unapproved production deployment
        run: |
          echo "::error::Automatic Neon production deployment is disabled."
          echo "A reviewed, exact migration operation and explicit user approval are required."
          exit 1
