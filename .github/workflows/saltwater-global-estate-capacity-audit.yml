name: Saltwater Global Estate Capacity Audit
on:
  push:
    branches: [main]
    paths:
      - "runtime/global_estate_capacity_audit.py"
      - "runtime/property_tenure_generator.py"
      - "runtime/property_world_generator.py"
      - "data/geography/saltwater-geography-v1.json"
      - "data/property/saltwater-property-world-v1.json"
      - "data/property/saltwater-property-world-v1.json.gz"
      - "data/property/saltwater-property-world-v1-summary.json"
      - "data/business/saltwater-business-registry-v1.json"
      - "tests/pkg001/test_global_estate_capacity_audit.py"
      - ".github/workflows/saltwater-global-estate-capacity-audit.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saltwater-global-estate-capacity-audit-main
  cancel-in-progress: true
jobs:
  audit-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry dependency
        run: python -m pip install "shapely==2.1.2"
      - name: Restore canonical property world JSON from compressed source
        run: gzip -dc data/property/saltwater-property-world-v1.json.gz > data/property/saltwater-property-world-v1.json
      - name: Generate global estate capacity audit
        run: python -m runtime.global_estate_capacity_audit
      - name: Run estate audit regression tests
        run: python -m unittest discover -s tests/pkg001 -p "test_global_estate_capacity_audit.py" -v
      - name: Persist compact audit on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/property/saltwater-global-estate-capacity-audit-v1.json
          if git diff --cached --quiet; then
            echo "Estate capacity audit is unchanged."
            exit 0
          fi
          git commit -m "Generate Saltwater global estate capacity audit"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
