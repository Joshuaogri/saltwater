name: SW-DB-001 disposable world provisioning and capacity proof

on:
  push:
    branches: ["main"]
    paths:
      - "db/proposals/0010_canonical_world_provisioning.sql"
      - "db/proposals/0011_bp04_property_premises_foundation.sql"
      - "db/proposals/0012_bp04_physical_asset_detail_profiles.sql"
      - "db/proposals/0009_universal_name_registry.sql"
      - "tests/pkg001/test_opening_resident_person_seed_postgres.py"
      - "runtime/opening_resident_person_seed.py"
      - "runtime/naming.py"
      - "data/people/saltwater-opening-civilian-resident-seed-v1.json.gz"
      - "db/proposals/0010_bp03_population_qualification_union.sql"
      - "db/proposals/0034_bp03_person_residence.sql"
      - "db/proposals/0036_bp03_individual_simulation_promotion.sql"
      - "db/proposals/0037_bp03_person_routines_and_movement.sql"
      - "db/proposals/0038_bp03_person_knowledge_boundary.sql"
      - "db/proposals/0039_bp03_person_attribute_claims.sql"
      - "tests/pkg001/bp03_individual_simulation_acceptance.sql"
      - "tests/pkg001/bp03_person_attribute_claims_acceptance.sql"
      - "tests/pkg001/bp03_person_knowledge_acceptance.sql"
      - "tests/pkg001/bp03_person_routines_movement_acceptance.sql"
      - "tests/pkg001/person_residence_acceptance.sql"
      - "runtime/sw_db_001_resident_residence_materializer.py"
      - "runtime/opening_resident_dwelling_allocation.py"
      - "runtime/bp02_operational_geography_package.py"
      - "runtime/bp02_operational_geography_importer.py"
      - "runtime/bp02_full_acceptance_audit.py"
      - "runtime/parcel_candidate_generator.py"
      - "runtime/building_access_route_corridor_audit.py"
      - "runtime/geography_geometry_audit.py"
      - "runtime/road_corridor_audit.py"
      - "runtime/road_reserve_topology.py"
      - "runtime/parcel_dossier_generator.py"
      - "runtime/parcel_dossier_geometry_audit.py"
      - "runtime/physical_asset_inventory_generator.py"
      - "runtime/building_access_candidate_audit.py"
      - "runtime/building_access_connector_topology_audit.py"
      - "runtime/building_access_connector_audit.py"
      - "runtime/bp04_geography_reconciliation.py"
      - "runtime/bp02_address_frontage_exception_resolution.py"
      - "runtime/bp02_fictional_geography_release.py"
      - "runtime/bp02_no_building_site_reconciliation.py"
      - "data/people/saltwater-opening-resident-dwelling-allocation-v1.json.gz"
      - "tests/pkg001/sw_db_001_*.sql"
      - "tests/pkg001/bp04_01_*.sql"
      - "tests/pkg001/bp04_02_*.sql"
      - "tests/pkg001/test_population_concurrency.py"
      - "tests/pkg001/population_cap_fixture.sql"
      - "scripts/verify_sw_db_001_contract.py"
      - "tests/pkg001/test_sw_db_001_contract.py"
      - "tests/pkg001/test_bp04_01_contract.py"
      - "tests/pkg001/test_bp04_02_contract.py"
      - ".github/workflows/sw-db-001-disposable.yml"
      - "docs/implementation/approval-packages/SW-DB-001-canonical-world-provisioning-and-capacity-proof.md"
  workflow_dispatch:
    inputs:
      full_bp03_residence_materialisation:
        description: "Run the opt-in full 9,000-resident disposable materialisation and replay checks"
        required: false
        type: boolean
        default: false

concurrency:
  group: sw-db-001-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run runtime kernel tests
        run: python -m unittest discover -s tests/pkg001 -p "test_runtime_kernel.py" -v
      - name: Run player command interface tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_interface.py" -v
      - name: Run canonical player command catalogue tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_commands.py" -v
      - name: Run player workspace tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_workspace.py" -v
      - name: Run recruitment adapter tests
        run: python -m unittest discover -s tests/pkg001 -p "test_recruitment.py" -v
      - name: Run naming service and generator tests
        run: python -m unittest discover -s tests/pkg001 -p "test_naming.py" -v
      - name: Run naming inventory tests
        run: python -m unittest discover -s tests/pkg001 -p "test_naming_inventory.py" -v
      - name: Run PostgreSQL naming adapter contract tests
        run: python -m unittest discover -s tests/pkg001 -p "test_postgres_naming.py" -v
      - name: Run player activation tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_activation.py" -v
      - name: Run player application tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_application.py" -v
      - name: Run authenticated player runtime tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_command_runtime.py" -v
      - name: Run trusted host tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_host_adapter.py" -v
      - name: Run ChatGPT tool handler tests
        run: python -m unittest discover -s tests/pkg001 -p "test_chatgpt_tool_handler.py" -v
      - name: Run scheduler tests
        run: python -m unittest discover -s tests/pkg001 -p "test_scheduling.py" -v
      - name: Run event engine tests
        run: python -m unittest discover -s tests/pkg001 -p "test_event_engine.py" -v
      - name: Run recovery tests
        run: python -m unittest discover -s tests/pkg001 -p "test_recovery.py" -v
      - name: Run authorization and hidden-truth tests
        run: python -m unittest discover -s tests/pkg001 -p "test_authorization.py" -v
      - name: Run SW-DB-001 contract tests
        run: python -m unittest discover -s tests/pkg001 -p "test_sw_db_001_contract.py" -v
      - name: Run BP04-01 contract tests
        run: python -m unittest discover -s tests/pkg001 -p "test_bp04_01_contract.py" -v
      - name: Run BP04-02 contract tests
        run: python -m unittest discover -s tests/pkg001 -p "test_bp04_02_contract.py" -v
      - name: Run migration runner unit tests
        run: python -m unittest discover -s tests/database -v

  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_USER: saltwater_test
          POSTGRES_DB: saltwater_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saltwater_test -d saltwater_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: saltwater_test
      PGPASSWORD: test-only
      PGDATABASE: saltwater_test
      DATABASE_URL: postgresql://saltwater_test:test-only@localhost:5432/saltwater_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL and deterministic geometry dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4" "shapely==2.1.2"
      - name: Audit disposable proposal sequence
        run: python scripts/verify_sw_db_001_contract.py
      - name: Apply existing disposable platform proposals 0002-0009
        run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/0001_foundation.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0002_runtime_city_population.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0003_actor_session_authorization.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0004_recruit_entry.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0005_player_identity_activation.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0006_bp37_tick_scheduling.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0007_bp35_event_dispatch.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0008_bp39_checkpoint_recovery.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0009_universal_name_registry.sql
          psql -v ON_ERROR_STOP=1 -f db/domain-migrations/bp02/0001_source_archive.sql
          psql -v ON_ERROR_STOP=1 -f db/domain-migrations/bp02/0002_operational_geography.sql
      - name: Measure proposal 0010 schema-only growth
        run: |
          before=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0010_canonical_world_provisioning.sql
          after=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "schema_database_bytes_before=$before"
          echo "schema_database_bytes_after=$after"
          echo "schema_incremental_bytes=$((after-before))"
          echo "schema_incremental_mb=$(awk -v d="$((after-before))" 'BEGIN {printf "%.6f",d/1000000}')"
          echo "schema_incremental_mib=$(awk -v d="$((after-before))" 'BEGIN {printf "%.6f",d/1048576}')"
          echo "proposal_source_bytes=$(wc -c < db/proposals/0010_canonical_world_provisioning.sql)"
      - name: Measure BP03 population and residence schema growth
        run: |
          before=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0010_bp03_population_qualification_union.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0034_bp03_person_residence.sql
          after=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "bp03_population_residence_schema_growth_bytes=$((after-before))"
      - name: Apply BP03 individual simulation services
        run: |
          before=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0036_bp03_individual_simulation_promotion.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0037_bp03_person_routines_and_movement.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0038_bp03_person_knowledge_boundary.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0039_bp03_person_attribute_claims.sql
          after=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "bp03_individual_simulation_schema_growth_bytes=$((after-before))"
      - name: Run BP03 individual tier and permanent promotion acceptance
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp03_individual_simulation_acceptance.sql
      - name: Run BP03 sourced person attribute claims acceptance
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp03_person_attribute_claims_acceptance.sql
      - name: Run BP03 person knowledge-boundary acceptance
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp03_person_knowledge_acceptance.sql
      - name: Run BP03 person routines and movement acceptance
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp03_person_routines_movement_acceptance.sql
      - name: Build current BP02 operational geography package
        timeout-minutes: 45
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m pip install 'shapely==2.1.2'
          python -u -m runtime.bp02_operational_geography_package
      - name: Import current BP02 operational geography into disposable world
        run: |
          python -m runtime.bp02_operational_geography_importer --apply --expected-database saltwater_test
          psql -v ON_ERROR_STOP=1 -c "SELECT schemaname,relname,pg_relation_size(format('%I.%I',schemaname,relname)) AS heap_bytes,pg_indexes_size(format('%I.%I',schemaname,relname)) AS index_bytes,pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes FROM pg_stat_user_tables WHERE schemaname IN ('sw_business','sw_ops') ORDER BY 5 DESC;"
      - name: Measure BP04-01 proposal 0011 schema-only growth
        run: |
          before=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0011_bp04_property_premises_foundation.sql
          psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp04_01_geography_fixture.sql
          psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp04_01_acceptance.sql
          after=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "bp04_01_schema_database_bytes_before=$before"
          echo "bp04_01_schema_database_bytes_after=$after"
          echo "bp04_01_schema_incremental_bytes=$((after-before))"
          echo "bp04_01_proposal_source_bytes=$(wc -c < db/proposals/0011_bp04_property_premises_foundation.sql)"
          psql -v ON_ERROR_STOP=1 -c "SELECT schemaname,relname,pg_relation_size(format('%I.%I',schemaname,relname)) AS heap_bytes,pg_indexes_size(format('%I.%I',schemaname,relname)) AS index_bytes,pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes FROM pg_stat_user_tables WHERE schemaname IN ('sw_property','sw_names') ORDER BY 5 DESC;"
      - name: Measure BP04-02 deep physical profile schema-only growth
        run: |
          before=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0012_bp04_physical_asset_detail_profiles.sql
          after=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "bp04_02_schema_database_bytes_before=$before"
          echo "bp04_02_schema_database_bytes_after=$after"
          echo "bp04_02_schema_incremental_bytes=$((after-before))"
          echo "bp04_02_proposal_source_bytes=$(wc -c < db/proposals/0012_bp04_physical_asset_detail_profiles.sql)"
          psql -v ON_ERROR_STOP=1 -c "SELECT schemaname,relname,pg_relation_size(format('%I.%I',schemaname,relname)) AS heap_bytes,pg_indexes_size(format('%I.%I',schemaname,relname)) AS index_bytes,pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes FROM pg_stat_user_tables WHERE schemaname='sw_property' ORDER BY 5 DESC;"
      - name: Run BP03 residence integration acceptance
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/person_residence_acceptance.sql
      - name: Provision deterministic opening population and business fixture (opt-in full BP03)
        if: ${{ github.event_name == 'push' || inputs.full_bp03_residence_materialisation }}
        run: |
          before=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -v source_revision="$GITHUB_SHA" -f tests/pkg001/sw_db_001_world_fixture.sql
          after=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "full_fixture_database_growth_bytes=$((after-before))"
          psql -v ON_ERROR_STOP=1 -c "SELECT count(*) AS people, count(*) FILTER (WHERE cohort='RESIDENT') AS residents, count(*) FILTER (WHERE cohort='POLICE_SUBSET') AS police_subset FROM sw_test.person_cohort;"
      - name: Materialise exactly 9,000 residents and reject tampered allocation replay (opt-in full BP03)
        if: ${{ github.event_name == 'push' || inputs.full_bp03_residence_materialisation }}
        run: python -m runtime.sw_db_001_resident_residence_materializer --negative-replay-test
      - name: Verify BP03 resident materialisation idempotency (opt-in full BP03)
        if: ${{ github.event_name == 'push' || inputs.full_bp03_residence_materialisation }}
        run: python -m runtime.sw_db_001_resident_residence_materializer
      - name: Reconcile exact BP03 resident assignments and population (opt-in full BP03)
        if: ${{ github.event_name == 'push' || inputs.full_bp03_residence_materialisation }}
        run: |
          psql -v ON_ERROR_STOP=1 -c "DO \$\$ DECLARE n_people bigint; n_residences bigint; n_assignments bigint; n_units bigint; n_usual bigint; n_population bigint; BEGIN SELECT count(*) INTO n_people FROM sw_test.person_cohort WHERE cohort='RESIDENT'; SELECT count(*) INTO n_residences FROM sw_people.person_residence r JOIN sw_test.person_cohort c USING (person_id) WHERE c.cohort='RESIDENT' AND r.residence_kind='permanent' AND r.residence_status='current'; SELECT count(*) INTO n_assignments FROM sw_test.opening_resident_dwelling_assignment; SELECT count(DISTINCT unit_id) INTO n_units FROM sw_test.opening_resident_dwelling_assignment; SELECT count(*) INTO n_usual FROM sw_people.population_state ps JOIN sw_test.person_cohort c USING (person_id) WHERE c.cohort='RESIDENT' AND ps.usual_resident; SELECT living_included INTO n_population FROM sw_people.population_counter WHERE singleton=1; IF n_people<>9000 OR n_residences<>9000 OR n_assignments<>9000 OR n_units<>9000 OR n_usual<>9000 OR n_population<>9500 THEN RAISE EXCEPTION 'BP03 full residence reconciliation failed: people %, residences %, assignments %, units %, usual residents %, population %',n_people,n_residences,n_assignments,n_units,n_usual,n_population; END IF; RAISE NOTICE 'BP03 FULL RESIDENCE PASS: 9000 residents, residences, assignments, unique units and usual-resident states; population counter 9500', n_population; END \$\$;"
      - name: Fast opening-world smoke check
        run: |
          psql -v ON_ERROR_STOP=1 -c "SELECT count(*) AS people FROM sw_people.person;"
          psql -v ON_ERROR_STOP=1 -c "SELECT count(*) AS businesses FROM sw_business.business;"
          psql -v ON_ERROR_STOP=1 -c "SELECT count(*) AS provisioning_manifests FROM sw_ops.provisioning_content_checksum;"
          psql -v ON_ERROR_STOP=1 -c "SELECT to_regclass('sw_people.person_residence') IS NOT NULL AS residence_service_present, to_regclass('sw_people.population_counter') IS NOT NULL AS population_counter_present, to_regclass('sw_names.name_reservation') IS NOT NULL AS naming_registry_present;"
