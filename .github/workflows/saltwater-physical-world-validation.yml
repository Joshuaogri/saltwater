name: Saltwater Canonical Physical World Validation
on:
  push:
    branches: [main]
    paths:
      - "data/geography/saltwater-physical-world-v1.json"
      - "data/geography/saltwater-geography-v1.json"
      - "tests/pkg001/test_saltwater_physical_world.py"
      - ".github/workflows/saltwater-physical-world-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry dependency
        run: python -m pip install "shapely==2.1.2"
      - name: Validate canonical physical world
        run: python -m unittest discover -s tests/pkg001 -p "test_saltwater_physical_world.py" -v
