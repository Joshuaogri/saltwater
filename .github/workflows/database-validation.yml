name: Database migration validation

on:
  push:
    branches: [main]
    paths:
      - "db/migrations/**"
      - "db/proposals/0002_runtime_city_population.sql"
      - "db/proposals/0003_legacy_checksum_adoption.sql"
      - "scripts/migrate.py"
      - "scripts/migrate_bp02.py"
      - "scripts/verify_legacy_baseline.py"
      - "tests/database/**"
      - ".github/workflows/database-validation.yml"
  pull_request:
    paths:
      - "db/migrations/**"
      - "scripts/migrate.py"
      - "tests/database/**"
      - ".github/workflows/database-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: saltwater
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: saltwater_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saltwater -d saltwater_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install migration runner dependency
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Apply ordered migrations through checksum-verified runner
        env:
          DATABASE_URL: postgresql://saltwater:test-only-password@localhost:5432/saltwater_test
        run: python scripts/migrate.py --apply
      - name: Verify BP04 letting authority and immutable event acceptance on disposable PostgreSQL
        env:
          PGPASSWORD: test-only-password
        run: psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_test -f tests/pkg001/bp04_letting_authority_acceptance.sql
      - name: Verify migration history and checksum idempotency across independent BP02 schema
        env:
          DATABASE_URL: postgresql://saltwater:test-only-password@localhost:5432/saltwater_test
          PGPASSWORD: test-only-password
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_test -c "CREATE SCHEMA sw_geo; CREATE TABLE sw_geo.bp02_schema_migration (version integer PRIMARY KEY, migration_name text NOT NULL, checksum_sha256 char(64) NOT NULL, applied_at timestamptz NOT NULL DEFAULT now())"
          python scripts/migrate.py
          python scripts/migrate.py --apply
          python scripts/migrate.py
      - name: Verify canonical world configuration and ledger constraints
        env:
          PGPASSWORD: test-only-password
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_test \
            -c "SELECT 1 FROM sw_core.world_config WHERE world_id = 1 AND country_name = 'Saltwater' AND city_name = 'Saltwater' AND living_population_limit = 10000 AND playable_city_count = 1"
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_test \
            -c "SELECT 1 FROM sw_ops.schema_migration WHERE version = 2 AND rtrim(checksum_sha256) ~ '^[0-9a-f]{64}$'"
      - name: Prove checksum drift and schema drift are rejected
        env:
          DATABASE_URL: postgresql://saltwater:test-only-password@localhost:5432/saltwater_test
          PGPASSWORD: test-only-password
        run: |
          cp -R db/migrations /tmp/saltwater-migrations-drift
          printf '\n-- deliberate checksum drift fixture\n' >> /tmp/saltwater-migrations-drift/0001_foundation.sql
          if python scripts/migrate.py --migrations /tmp/saltwater-migrations-drift; then
            echo "ERROR: checksum drift was not detected"
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_test \
            -c "ALTER TABLE sw_core.world_config ADD COLUMN bp38_drift_probe integer"
          if python scripts/migrate.py; then
            echo "ERROR: live schema drift was not detected"
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_test \
            -c "ALTER TABLE sw_core.world_config DROP COLUMN bp38_drift_probe"
          python scripts/migrate.py
      - name: Prove legacy NULL checksums are refused
        env:
          DATABASE_URL: postgresql://saltwater:test-only-password@localhost:5432/saltwater_test
          PGPASSWORD: test-only-password
        run: |
          foundation_checksum="$(sha256sum db/migrations/0001_foundation.sql | awk '{print $1}')"
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_test -c "ALTER TABLE sw_ops.schema_migration ALTER COLUMN checksum_sha256 DROP NOT NULL"
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_test -c "UPDATE sw_ops.schema_migration SET checksum_sha256 = NULL WHERE version = 1"
          if python scripts/migrate.py; then
            echo "ERROR: legacy NULL checksum was not rejected"
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_test -c "UPDATE sw_ops.schema_migration SET checksum_sha256 = '$foundation_checksum' WHERE version = 1"
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_test -c "ALTER TABLE sw_ops.schema_migration ALTER COLUMN checksum_sha256 SET NOT NULL"
          python scripts/migrate.py
      - name: Prove failed migrations roll back schema and ledger atomically
        env:
          DATABASE_URL: postgresql://saltwater:test-only-password@localhost:5432/saltwater_test
          PGPASSWORD: test-only-password
        run: |
          cp -R db/migrations /tmp/saltwater-migrations-failure
          failure_version="$(printf '%04d' "$(( $(find db/migrations -maxdepth 1 -type f -name '*.sql' | wc -l) + 1 ))")"
          failure_version_num="$((10#$failure_version))"
          cat > "/tmp/saltwater-migrations-failure/${failure_version}_atomicity_failure.sql" <<'SQL'
          BEGIN;
          CREATE TABLE sw_core.bp38_atomicity_probe (id integer PRIMARY KEY);
          SELECT 1 / 0;
          COMMIT;
          SQL
          if python scripts/migrate.py --apply --migrations /tmp/saltwater-migrations-failure > /tmp/bp38-failed-migration.log 2>&1; then
            echo "ERROR: intentionally failing migration unexpectedly succeeded"
            exit 1
          fi
          grep -q "division by zero" /tmp/bp38-failed-migration.log
          rollback_check="$(psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_test -Atc "SELECT CASE WHEN to_regclass('sw_core.bp38_atomicity_probe') IS NULL AND NOT EXISTS (SELECT 1 FROM sw_ops.schema_migration WHERE version = ${failure_version_num}) THEN 'PASS' ELSE 'FAIL' END")"
          test "$rollback_check" = "PASS"
      - name: Apply PKG-001 proposal to disposable PostgreSQL only
        env:
          PGPASSWORD: test-only-password
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_test -f db/proposals/0002_runtime_city_population.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_test -f tests/pkg001/database_acceptance.sql
      - name: Test guarded legacy checksum adoption in disposable database only
        env:
          PGPASSWORD: test-only-password
        run: |
          createdb -h localhost -U saltwater saltwater_legacy_adoption
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_legacy_adoption -f db/migrations/0001_foundation.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_legacy_adoption -f db/proposals/0003_legacy_checksum_adoption.sql
          adopted="$(psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_legacy_adoption -Atc "SELECT checksum_sha256 FROM sw_ops.schema_migration WHERE version = 1 AND migration_name = 'foundation'")"
          test "$adopted" = "d4f874f71eb53a961fd3abe87a9342d0354a006ef04575158d2c72937dbe6aa8"
          if psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_legacy_adoption -f db/proposals/0003_legacy_checksum_adoption.sql; then
            echo "ERROR: repeated checksum adoption did not fail closed"
            exit 1
          fi
          unchanged="$(psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_legacy_adoption -Atc "SELECT checksum_sha256 FROM sw_ops.schema_migration WHERE version = 1 AND migration_name = 'foundation'")"
          test "$unchanged" = "$adopted"
      - name: Replay exact 0001 source into an isolated baseline database
        env:
          PGPASSWORD: test-only-password
        run: |
          createdb -h localhost -U saltwater saltwater_baseline
          createdb -h localhost -U saltwater saltwater_baseline_target
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_baseline -f db/migrations/0001_foundation.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_baseline_target -f db/migrations/0001_foundation.sql
      - name: Compare clean replay against read-only reference snapshot
        env:
          PGPASSWORD: test-only-password
          BASELINE_REFERENCE_DATABASE_URL: postgresql://saltwater:test-only-password@localhost:5432/saltwater_baseline
          BASELINE_TARGET_DATABASE_URL: postgresql://saltwater:test-only-password@localhost:5432/saltwater_baseline_target
        run: |
          python scripts/verify_legacy_baseline.py
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_baseline_target -c "ALTER TABLE sw_core.world_config ADD COLUMN bp38_comparison_probe integer"
          if python scripts/verify_legacy_baseline.py; then
            echo "ERROR: independent schema difference was not detected"
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -h localhost -U saltwater -d saltwater_baseline_target -c "ALTER TABLE sw_core.world_config DROP COLUMN bp38_comparison_probe"
          python scripts/verify_legacy_baseline.py
      - name: Run migration-runner unit tests
        run: python -m unittest discover -s tests/database -v
      - name: Run Python runtime-kernel tests
        run: python -m unittest discover -s tests/pkg001 -p "test_runtime_kernel.py" -v
