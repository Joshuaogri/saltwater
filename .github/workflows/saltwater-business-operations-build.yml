name: Saltwater Business Operations Schedule Build
on:
  push:
    branches: [main]
    paths:
      - "runtime/business_operations_generator.py"
      - "runtime/business_registry_generator.py"
      - "runtime/property_world_generator.py"
      - "data/geography/saltwater-geography-v1.json"
      - "data/geography/saltwater-geography-v1.json.gz"
      - "tests/pkg001/test_business_operations_generator.py"
      - ".github/workflows/saltwater-business-operations-build.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saltwater-business-operations-main
  cancel-in-progress: true
jobs:
  build-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic geometry dependency
        run: python -m pip install "shapely==2.1.2"
      - name: Generate 70,000 weekly business-day records
        run: python -m runtime.business_operations_generator
      - name: Run business operating schedule regression tests
        run: python -m unittest discover -s tests/pkg001 -p "test_business_operations_generator.py" -v
      - name: Persist textual operating schedules on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/business/saltwater-business-operations-v1.json
          if git diff --cached --quiet; then
            echo "Business operating schedules are unchanged."
            exit 0
          fi
          git commit -m "Generate Saltwater business operating schedules"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Unable to publish generated data after six main-branch retries." >&2
              exit 1
            fi
            sleep "$attempt"
          done
