name: BP04-03 Access Route Corridor Candidate Audit

on:
  push:
    branches: [main]
    paths:
      - "data/geography/saltwater-geography-v1.json"
      - "runtime/road_corridor_audit.py"
      - "runtime/parcel_candidate_generator.py"
      - "runtime/parcel_dossier_generator.py"
      - "runtime/physical_asset_inventory_generator.py"
      - "runtime/building_access_route_corridor_audit.py"
      - "tests/pkg001/test_building_access_route_corridor_audit.py"
      - ".github/workflows/bp04-03-access-route-corridor-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-corridor-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned geometry engine
        run: python -m pip install "shapely==2.1.2"
      - name: Run route-corridor candidate regression tests
        run: python -m unittest discover -s tests/pkg001 -p "test_building_access_route_corridor_audit.py" -v
      - name: Generate read-only route-corridor candidate manifest
        run: python -m runtime.building_access_route_corridor_audit
      - name: Upload route-corridor candidate manifest
        uses: actions/upload-artifact@v4
        with:
          name: bp04-03-route-corridor-candidates
          path: bp04-03-route-corridor-candidates.json
          if-no-files-found: error
          retention-days: 14
