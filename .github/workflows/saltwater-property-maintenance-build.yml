name: Saltwater Property Maintenance and Repairs Build
on:
  push:
    branches: [main]
    paths:
      - "runtime/property_maintenance_generator.py"
      - "runtime/property_world_generator.py"
      - "runtime/property_tenure_generator.py"
      - "data/property/saltwater-property-world-v1.json.gz"
      - "data/property/saltwater-property-tenure-v1.json.gz"
      - "data/property/saltwater-building-services-v1.json.gz"
      - "tests/pkg001/test_property_maintenance_generator.py"
      - ".github/workflows/saltwater-property-maintenance-build.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saltwater-property-maintenance-main
  cancel-in-progress: true
jobs:
  build-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic geometry dependency
        run: python -m pip install "shapely==2.1.2"
      - name: Restore compressed canonical inputs
        run: |
          for archive in data/property/saltwater-property-world-v1.json.gz data/property/saltwater-property-tenure-v1.json.gz data/property/saltwater-building-services-v1.json.gz; do
            gzip -t "$archive"
            gzip -dc "$archive" > "${archive%.gz}"
          done
      - name: Generate property maintenance and repair records
        run: python -m runtime.property_maintenance_generator
      - name: Run property maintenance regression tests
        run: python -m unittest discover -s tests/pkg001 -p "test_property_maintenance_generator.py" -v
      - name: Compress maintenance dataset
        run: |
          gzip -9 -n -c data/property/saltwater-property-maintenance-v1.json > data/property/saltwater-property-maintenance-v1.json.gz
          gzip -t data/property/saltwater-property-maintenance-v1.json.gz
          rm data/property/saltwater-property-maintenance-v1.json
      - name: Persist compact maintenance dataset on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/property/saltwater-property-maintenance-v1.json.gz
          git rm --ignore-unmatch data/property/saltwater-property-maintenance-v1.json
          if git diff --cached --quiet; then
            echo "Property maintenance dataset is unchanged."
            exit 0
          fi
          git commit -m "Generate Saltwater property maintenance and repair records"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
