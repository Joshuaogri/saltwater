name: BP02 Full Parcel Address Access Acceptance Audit

on:
  push:
    branches: [main]
    paths:
      - "data/geography/saltwater-geography-v1.json"
      - "data/geography/saltwater-geography-v1-identity-map.json"
      - "data/property/saltwater-property-world-v1.json.gz"
      - "runtime/bp02_address_frontage_exception_resolution.py"
      - "runtime/bp02_address_review_register.py"
      - "runtime/bp02_full_acceptance_audit.py"
      - "runtime/bp04_geography_reconciliation.py"
      - "runtime/geography_geometry_audit.py"
      - "runtime/parcel_candidate_generator.py"
      - "runtime/parcel_dossier_generator.py"
      - "runtime/parcel_dossier_geometry_audit.py"
      - "runtime/physical_asset_inventory_generator.py"
      - "runtime/building_access_candidate_audit.py"
      - "runtime/building_access_connector_topology_audit.py"
      - "runtime/building_access_connector_audit.py"
      - "runtime/building_access_route_corridor_audit.py"
      - "tests/pkg001/test_bp02_address_frontage_exception_resolution.py"
      - "tests/pkg001/test_bp02_address_review_register.py"
      - ".github/workflows/bp02-full-acceptance-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-bp02-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned geometry engine
        run: python -m pip install "shapely==2.1.2"
      - name: Test address review and geometry exception dispositions
        run: |
          python -m unittest tests.pkg001.test_bp02_address_review_register tests.pkg001.test_bp02_address_frontage_exception_resolution -v
      - name: Run complete BP-02 parcel, address and access-point acceptance audit
        run: python -m runtime.bp02_full_acceptance_audit
      - name: Upload complete BP-02 acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bp02-full-parcel-address-access-acceptance
          path: bp02-full-parcel-address-access-acceptance.json
          if-no-files-found: error
          retention-days: 30
