name: Saltwater Python regression suite

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "tests/pkg001/**"
      - "data/**"
      - "db/migrations/**"
      - "db/proposals/**"
      - "scripts/**"
      - ".github/workflows/python-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saltwater-python-regression-main
  cancel-in-progress: true

jobs:
  python-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic geometry engine
        run: python -m pip install "shapely==2.1.2"
      - name: Run BP01 foundational canon and reveal-trigger contract tests
        run: python -m unittest discover -s tests/pkg001 -p "test_bp01_foundations.py" -v
      - name: Run runtime kernel tests
        run: python -m unittest discover -s tests/pkg001 -p "test_runtime_kernel.py" -v
      - name: Run player command interface tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_interface.py" -v
      - name: Run BP40-02 canonical command catalogue and parser tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_commands.py" -v
      - name: Run BP40-01 player workspace tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_workspace.py" -v
      - name: Run recruit-entry adapter tests
        run: python -m unittest discover -s tests/pkg001 -p "test_recruitment.py" -v
      - name: Run SW-NAM-001 naming service and generator tests
        run: python -m unittest discover -s tests/pkg001 -p "test_naming.py" -v
      - name: Run opening police person seed tests
        run: python -m unittest discover -s tests/pkg001 -p "test_opening_police_person_seed.py" -v
      - name: Run SW-NAM-001 canon inventory dry-run tests
        run: python -m unittest discover -s tests/pkg001 -p "test_naming_inventory.py" -v
      - name: Run SW-NAM-001 PostgreSQL adapter contract tests
        run: python -m unittest discover -s tests/pkg001 -p "test_postgres_naming.py" -v
      - name: Run BP04 business registry integrity audit tests
        run: python -m unittest discover -s tests/pkg001 -p "test_bp04_business_registry_audit.py" -v
      - name: Run BP04 property tenure and agreement lifecycle history tests
        run: python -m unittest discover -s tests/pkg001 -p "test_property_tenure_generator.py" -v
      - name: Run accepted-player activation adapter tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_activation.py" -v
      - name: Run durable player application composition tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_application.py" -v
      - name: Run authenticated player command runtime tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_command_runtime.py" -v
      - name: Run trusted player host adapter tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_host_adapter.py" -v
      - name: Run ChatGPT tool handler contract tests
        run: python -m unittest discover -s tests/pkg001 -p "test_chatgpt_tool_handler.py" -v
      - name: Run BP37-01 tick scheduler tests
        run: python -m unittest discover -s tests/pkg001 -p "test_scheduling.py" -v
      - name: Run BP35-01 deterministic event engine tests
        run: python -m unittest discover -s tests/pkg001 -p "test_event_engine.py" -v
      - name: Run BP39-01 recovery contract tests
        run: python -m unittest discover -s tests/pkg001 -p "test_recovery.py" -v
      - name: Run actor authorization and hidden-truth gate tests
        run: python -m unittest discover -s tests/pkg001 -p "test_authorization.py" -v
      - name: Run authoritative BP06 personnel identity verifier tests
        run: python -m unittest discover -s tests/pkg001 -p "test_bp06_personnel_reference.py" -v
      - name: Run BP12 command handover PostgreSQL adapter contract tests
        run: python -m unittest discover -s tests/pkg001 -p "test_bp12_command_handover_postgres.py" -v
      - name: Run BP12 incident operations service tests
        run: python -m unittest discover -s tests/pkg001 -p "test_bp12_incident_service.py" -v
      - name: Run BP09 resource readiness service tests
        run: python -m unittest discover -s tests/pkg001 -p "test_bp09_resource_service.py" -v
      - name: Run BP11 dispatch lifecycle tests
        run: python -m unittest discover -s tests/pkg001 -p "test_bp11_dispatch_lifecycle.py" -v
      - name: Run BP11 dispatcher console tests
        run: python -m unittest discover -s tests/pkg001 -p "test_bp11_dispatcher_console.py" -v
      - name: Run BP11 dispatch creation tests
        run: python -m unittest discover -s tests/pkg001 -p "test_bp11_dispatch_creation.py" -v
      - name: Run BP08 deployment port tests
        run: python -m unittest discover -s tests/pkg001 -p "test_postgres_deployment_port.py" -v
      - name: Run BP11 dispatch board tests
        run: python -m unittest discover -s tests/pkg001 -p "test_bp11_dispatch_board.py" -v
      - name: Run single-player NPC workforce generator tests
        run: python -m unittest discover -s tests/pkg001 -p "test_npc_workforce.py" -v
      - name: Run single-player NPC dispatch and crew lifecycle tests
        run: python -m unittest discover -s tests/pkg001 -p "test_npc_dispatch.py" -v
      - name: Run player-facing NPC dispatch console tests
        run: python -m unittest discover -s tests/pkg001 -p "test_npc_dispatch_console.py" -v
      - name: Run canonical PostgreSQL NPC workforce source tests
        run: python -m unittest discover -s tests/pkg001 -p "test_postgres_npc_dispatch.py" -v

