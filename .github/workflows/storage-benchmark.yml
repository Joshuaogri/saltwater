name: Saltwater synthetic lifecycle storage benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify foundation and run temporary synthetic benchmark
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is missing or empty."
            exit 1
          fi

          FOUNDATION=$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc \
            "SELECT EXISTS (SELECT 1 FROM sw_ops.schema_migration WHERE version = 1);")
          if [ "$FOUNDATION" != "t" ]; then
            echo "::error::Saltwater foundation migration 0001 is not installed."
            exit 1
          fi

          echo "database_size_before_bytes=$(psql "$DATABASE_URL" -X -Atc "SELECT pg_database_size(current_database());")"
          echo "benchmark_scope=10k residents; 10k businesses; 30k relationships; 20k employment records; 2k cases; 10k incidents; 10k evidence metadata; 150k historical events"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f db/benchmarks/0001_lifecycle_storage_benchmark.sql
          echo "database_size_after_bytes=$(psql "$DATABASE_URL" -X -Atc "SELECT pg_database_size(current_database());")"
          echo "note=Benchmark tables are session-local temporary tables and are removed when the connection closes."
