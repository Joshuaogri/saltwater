name: Saltwater persistent isolated lifecycle benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Build, measure and remove isolated persistent benchmark
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is missing or empty."
            exit 1
          fi

          FOUNDATION=$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc \
            "SELECT EXISTS (SELECT 1 FROM sw_ops.schema_migration WHERE version = 1);")
          if [ "$FOUNDATION" != "t" ]; then
            echo "::error::Saltwater foundation migration 0001 is not installed."
            exit 1
          fi

          cleanup() {
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c \
              "DROP SCHEMA IF EXISTS sw_bench_run CASCADE;" || true
          }
          trap cleanup EXIT

          # This name is reserved exclusively for disposable benchmark objects.
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c \
            "DROP SCHEMA IF EXISTS sw_bench_run CASCADE;"

          echo "database_size_before_bytes=$(psql "$DATABASE_URL" -X -Atc "SELECT pg_database_size(current_database());")"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f db/benchmarks/0003_persistent_lifecycle_storage_benchmark.sql

          echo "database_size_during_bytes=$(psql "$DATABASE_URL" -X -Atc "SELECT pg_database_size(current_database());")"
          echo "persistent_benchmark_schema_size_bytes=$(psql "$DATABASE_URL" -X -Atc "SELECT COALESCE(sum(pg_total_relation_size(c.oid)),0) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='sw_bench_run' AND c.relkind IN ('r','m');")"

          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "DROP SCHEMA sw_bench_run CASCADE;"
          echo "database_size_after_cleanup_bytes=$(psql "$DATABASE_URL" -X -Atc "SELECT pg_database_size(current_database());")"
          trap - EXIT
          echo "note=Persistent benchmark tables were measured before cleanup; isolated schema was then dropped."
