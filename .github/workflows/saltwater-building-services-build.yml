name: Saltwater Building Systems and Utilities Build
on:
  push:
    branches: [main]
    paths:
      - "runtime/building_services_generator.py"
      - "runtime/property_world_generator.py"
      - "runtime/property_tenure_generator.py"
      - "runtime/dataset_io.py"
      - "data/property/saltwater-property-world-v1.json"
      - "data/property/saltwater-property-world-v1.json.gz"
      - "data/property/saltwater-building-services-v1.json.gz"
      - "data/property/saltwater-property-tenure-v1.json"
      - "data/property/saltwater-property-tenure-v1.json.gz"
      - "tests/pkg001/test_building_services_generator.py"
      - ".github/workflows/saltwater-building-services-build.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saltwater-building-services-main
  cancel-in-progress: true
jobs:
  build-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic geometry dependency
        run: python -m pip install "shapely==2.1.2"
      - name: Generate building systems and utilities
        run: python -m runtime.building_services_generator
      - name: Run building systems and utilities regression tests
        run: python -m unittest discover -s tests/pkg001 -p "test_building_services_generator.py" -v
      - name: Persist compact building services dataset on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gzip -9 -n -c data/property/saltwater-building-services-v1.json > data/property/saltwater-building-services-v1.json.gz
          gzip -t data/property/saltwater-building-services-v1.json.gz
          sha256sum data/property/saltwater-building-services-v1.json.gz
          rm data/property/saltwater-building-services-v1.json
          git add data/property/saltwater-building-services-v1.json.gz
          git rm --ignore-unmatch data/property/saltwater-building-services-v1.json
          if git diff --cached --quiet; then
            echo "Building services dataset is unchanged."
            exit 0
          fi
          git commit -m "Generate Saltwater building systems and utility networks"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Unable to publish generated data after six main-branch retries." >&2
              exit 1
            fi
            sleep "$attempt"
          done
