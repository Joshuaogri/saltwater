name: BP04 typed import acceptance — disposable PostgreSQL 16/18

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/property/*.json.gz"
      - "data/business/*.json.gz"
      - "runtime/bp04_property_stack_importer.py"
      - "db/migrations/**"
      - "tests/pkg001/bp04_property_import_acceptance.sql"
      - ".github/workflows/bp04-typed-import-disposable.yml"

permissions:
  contents: read

concurrency:
  group: bp04-typed-import-main
  cancel-in-progress: true

jobs:
  typed-import:
    name: typed-import (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: saltwater_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: saltwater_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saltwater_test -d saltwater_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://saltwater_test:test-only-password@localhost:5432/saltwater_test
      PGPASSWORD: test-only-password
      PGUSER: saltwater_test
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: saltwater_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install importer and migration dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Apply all ordered migrations to disposable PostgreSQL
        run: python scripts/migrate.py --apply
      - name: Import all mapped BP04 collections in typed-relational disposable mode
        run: python runtime/bp04_property_stack_importer.py --typed-relational
      - name: Verify 14 datasets, 108 collections, 1,978,447 source rows and typed role links
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/pkg001/bp04_property_import_acceptance.sql
      - name: Measure typed database and relation sizes before idempotent repeat
        run: |
          psql "$DATABASE_URL" -Atc "SELECT pg_database_size(current_database())" > /tmp/bp04-typed-size-before.txt
          psql "$DATABASE_URL" -Atc "SELECT schemaname||'.'||relname||'|'||n_tup_ins||'|'||n_tup_upd||'|'||n_tup_del FROM pg_stat_user_tables ORDER BY schemaname,relname" > /tmp/bp04-typed-row-stats-before.txt
          psql "$DATABASE_URL" -Atc "SELECT schemaname||'.'||relname||'|'||pg_total_relation_size(relid) FROM pg_stat_user_tables ORDER BY schemaname,relname" > /tmp/bp04-typed-relations-before.txt
      - name: Repeat typed import to verify immutable event and row idempotency
        run: python runtime/bp04_property_stack_importer.py --typed-relational
      - name: Recheck typed import acceptance after repeat
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/pkg001/bp04_property_import_acceptance.sql
      - name: Assert repeat import leaves database storage unchanged and identify any growing relations
        run: |
          psql "$DATABASE_URL" -Atc "SELECT pg_database_size(current_database())" > /tmp/bp04-typed-size-after.txt
          psql "$DATABASE_URL" -Atc "SELECT schemaname||'.'||relname||'|'||n_tup_ins||'|'||n_tup_upd||'|'||n_tup_del FROM pg_stat_user_tables ORDER BY schemaname,relname" > /tmp/bp04-typed-row-stats-after.txt
          psql "$DATABASE_URL" -Atc "SELECT schemaname||'.'||relname||'|'||pg_total_relation_size(relid) FROM pg_stat_user_tables ORDER BY schemaname,relname" > /tmp/bp04-typed-relations-after.txt
          diff -u /tmp/bp04-typed-row-stats-before.txt /tmp/bp04-typed-row-stats-after.txt
          diff -u /tmp/bp04-typed-relations-before.txt /tmp/bp04-typed-relations-after.txt || true
          before=$(cat /tmp/bp04-typed-size-before.txt)
          after=$(cat /tmp/bp04-typed-size-after.txt)
          delta=$((after-before))
          echo "Repeat-import database-size delta: $delta bytes"
          if (( delta > 2097152 )); then
            echo "Repeat import exceeded the 2 MiB maintenance-growth allowance."
            exit 1
          fi
          cat /tmp/bp04-typed-size-after.txt
