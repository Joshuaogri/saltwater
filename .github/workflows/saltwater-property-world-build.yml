name: Saltwater Canonical Property World Build
on:
  push:
    branches: [main]
    paths:
      - "runtime/property_world_generator.py"
      - "runtime/opening_resident_dwelling_allocation.py"
      - "data/people/saltwater-opening-civilian-resident-seed-v1.json.gz"
      - "tests/pkg001/test_opening_resident_dwelling_allocation.py"
      - "runtime/physical_asset_inventory_generator.py"
      - "runtime/physical_asset_inventory_generator.py"
      - "runtime/parcel_candidate_generator.py"
      - "runtime/parcel_dossier_generator.py"
      - "runtime/road_corridor_audit.py"
      - "runtime/road_reserve_topology.py"
      - "data/geography/saltwater-geography-v1.json"
      - "data/geography/saltwater-geography-v1.json.gz"
      - "tests/pkg001/test_property_world_generator.py"
      - ".github/workflows/saltwater-property-world-build.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saltwater-property-world-main
  cancel-in-progress: true
jobs:
  build-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic geometry dependency
        run: python -m pip install "shapely==2.1.2"
      - name: Generate canonical property world
        run: python -m runtime.property_world_generator
      - name: Run property hierarchy and access regression tests
        run: python -m unittest discover -s tests/pkg001 -p "test_property_world_generator.py" -v
      - name: Compress canonical property world for Git storage
        run: |
          gzip -9 -n -c data/property/saltwater-property-world-v1.json > data/property/saltwater-property-world-v1.json.gz
          gzip -t data/property/saltwater-property-world-v1.json.gz
          sha256sum data/property/saltwater-property-world-v1.json.gz
          rm data/property/saltwater-property-world-v1.json
      - name: Build deterministic BP03 civilian dwelling allocation candidate
        run: python -m runtime.opening_resident_dwelling_allocation
      - name: Validate BP03 dwelling allocation candidate
        run: python -m unittest discover -s tests/pkg001 -p "test_opening_resident_dwelling_allocation.py" -v
      - name: Persist generated compressed game records on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/property/saltwater-property-world-v1.json.gz data/property/saltwater-property-world-v1-summary.json data/people/saltwater-opening-resident-dwelling-allocation-v1.json.gz data/people/saltwater-opening-resident-dwelling-allocation-v1-summary.json
          git rm --ignore-unmatch data/property/saltwater-property-world-v1.json
          if git diff --cached --quiet; then
            echo "Canonical property world is unchanged."
            exit 0
          fi
          git commit -m "Generate canonical Saltwater property world"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Unable to publish generated data after six main-branch retries." >&2
              exit 1
            fi
            sleep "$attempt"
          done
