name: BP04-03 Building Access Candidate Reconciliation

on:
  push:
    branches: [main]
    paths:
      - "data/geography/saltwater-geography-v1.json"
      - "runtime/parcel_candidate_generator.py"
      - "runtime/parcel_dossier_generator.py"
      - "runtime/physical_asset_inventory_generator.py"
      - "runtime/building_access_candidate_audit.py"
      - "runtime/road_corridor_audit.py"
      - "runtime/road_reserve_topology.py"
      - "tests/pkg001/test_building_access_candidate_audit.py"
      - ".github/workflows/bp04-03-building-access-candidate-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  building-access-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned geometry engine
        run: python -m pip install "shapely==2.1.2"
      - name: Run building access candidate reconciliation tests
        run: python -m unittest discover -s tests/pkg001 -p "test_building_access_candidate_audit.py" -v
      - name: Emit read-only building access candidate reconciliation report
        run: python -m runtime.building_access_candidate_audit
