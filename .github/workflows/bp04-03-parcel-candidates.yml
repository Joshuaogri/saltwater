name: BP04-03 Stage B Parcel Candidate Generation

on:
  push:
    branches: [main]
    paths:
      - "data/geography/saltwater-geography-v1.json"
      - "runtime/parcel_candidate_generator.py"
      - "tests/pkg001/test_parcel_candidate_generator.py"
      - ".github/workflows/bp04-03-parcel-candidates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parcel-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic candidate generator tests
        run: python -m unittest discover -s tests/pkg001 -p "test_parcel_candidate_generator.py" -v
      - name: Generate candidate parcel layer and manifest
        run: python -m runtime.parcel_candidate_generator
      - name: Upload candidate layer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bp04-03-stage-b-parcel-candidates
          path: bp04-03-stage-b-parcel-candidates.json
          if-no-files-found: error
          retention-days: 30
