name: PKG-001 disposable PostgreSQL validation
# BP06 opening-cohort acceptance runs immediately after schema proposals, at tick-zero bootstrap.

on:
  push:
    branches:
      - "main"
    paths:
      - "db/proposals/0002_runtime_city_population.sql"
      - "db/proposals/0003_actor_session_authorization.sql"
      - "db/proposals/0004_recruit_entry.sql"
      - "db/proposals/0005_player_identity_activation.sql"
      - "db/proposals/0006_bp37_tick_scheduling.sql"
      - "db/proposals/0007_bp35_event_dispatch.sql"
      - "db/proposals/0008_bp39_checkpoint_recovery.sql"
      - "db/proposals/0009_universal_name_registry.sql"
      - "db/proposals/0010_bp03_population_qualification_union.sql"
      - "db/proposals/0034_bp03_person_residence.sql"
      - "db/proposals/0035_bp03_household_membership.sql"
      - "db/domain-migrations/bp02/0001_source_archive.sql"
      - "db/domain-migrations/bp02/0002_operational_geography.sql"
      - "tests/pkg001/person_residence_acceptance.sql"
      - "tests/pkg001/household_membership_acceptance.sql"
      - "tests/pkg001/population_union_acceptance.sql"
      - "db/proposals/0012_bp04_canonical_property_stack.sql"
      - "db/proposals/0030_bp04_business_text_id_naming.sql"
      - "db/proposals/0023_bp05_police_architecture.sql"
      - "db/proposals/0024_bp06_personnel_service_records.sql"
      - "db/proposals/0025_bp07_career_rank_and_post_history.sql"
      - "db/proposals/0026_bp08_unit_deployment.sql"
      - "db/proposals/0027_bp09_police_resource_readiness.sql"
      - "db/proposals/0028_bp12_incident_management.sql"
      - "db/proposals/0029_bp12_command_handover.sql"
      - "tests/pkg001/police_architecture_acceptance.sql"
      - "tests/pkg001/personnel_service_acceptance.sql"
      - "tests/pkg001/career_history_acceptance.sql"
      - "tests/pkg001/unit_deployment_acceptance.sql"
      - "tests/pkg001/resource_readiness_acceptance.sql"
      - "tests/pkg001/incident_management_acceptance.sql"
      - "runtime/naming.py"
      - "runtime/name_generation.py"
      - "runtime/naming_inventory.py"
      - "runtime/postgres_naming.py"
      - "tests/pkg001/test_postgres_naming.py"
      - "tests/pkg001/test_naming_inventory.py"
      - "tests/pkg001/test_naming.py"
      - "tests/pkg001/test_naming_postgres.py"
      - "tests/pkg001/test_business_naming_postgres.py"
      - "data/business/saltwater-business-registry-v1.json"
      - "data/business/saltwater-business-registry-v1.json.gz"
      - "data/naming/saltwater-person-naming-v1.json"
      - "data/people/saltwater-opening-police-person-seed-v1.json"
      - "data/people/saltwater-opening-police-person-seed-v1.json.gz"
      - "runtime/opening_police_person_seed.py"
      - "tests/pkg001/test_opening_police_person_seed.py"
      - "tests/pkg001/naming_acceptance.sql"
      - "tests/pkg001/test_recruitment.py"
      - "tests/pkg001/recruit_entry_acceptance.sql"
      - "tests/pkg001/bp39_recovery_acceptance.sql"
      - "tests/pkg001/test_recovery.py"
      - "runtime/recovery.py"
      - "tests/pkg001/event_dispatch_acceptance.sql"
      - "tests/pkg001/test_event_engine.py"
      - "runtime/scheduling.py"
      - "tests/pkg001/test_scheduling.py"
      - "tests/pkg001/scheduling_acceptance.sql"
      - "docs/implementation/approval-packages/PKG-003-recruit-entry-vertical-slice.md"
      - "db/migrations/0001_foundation.sql"
  workflow_dispatch:

concurrency:
  group: pkg001-disposable-postgres-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_USER: saltwater_test
          POSTGRES_DB: saltwater_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saltwater_test -d saltwater_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: saltwater_test
      PGPASSWORD: test-only
      PGDATABASE: saltwater_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply foundation and PKG-001 to disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/0001_foundation.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0002_runtime_city_population.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0003_actor_session_authorization.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0004_recruit_entry.sql
          before=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0005_player_identity_activation.sql
          before_schedule=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0006_bp37_tick_scheduling.sql
          before_event_engine=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0007_bp35_event_dispatch.sql
          after_event_engine=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "bp35_event_dispatch_schema_growth_bytes=$((after_event_engine-before_event_engine))"
          before_recovery=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0008_bp39_checkpoint_recovery.sql
          after_recovery=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "bp39_checkpoint_recovery_schema_growth_bytes=$((after_recovery-before_recovery))"
          before_naming=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0009_universal_name_registry.sql
          before_bp03_population=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0010_bp03_population_qualification_union.sql
          psql -v ON_ERROR_STOP=1 -f tests/pkg001/population_union_acceptance.sql
          after_bp03_population=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "bp03_population_service_schema_growth_bytes=$((after_bp03_population-before_bp03_population))"
          psql -v ON_ERROR_STOP=1 -f db/domain-migrations/bp02/0001_source_archive.sql
          psql -v ON_ERROR_STOP=1 -f db/domain-migrations/bp02/0002_operational_geography.sql
          before_bp03_residence=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0034_bp03_person_residence.sql
          psql -v ON_ERROR_STOP=1 -f tests/pkg001/person_residence_acceptance.sql
          after_bp03_residence=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "bp03_bp02_residence_schema_growth_bytes=$((after_bp03_residence-before_bp03_residence))"
          psql -v ON_ERROR_STOP=1 -f db/proposals/0012_bp04_canonical_property_stack.sql
          before_bp03_households=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0035_bp03_household_membership.sql
          psql -v ON_ERROR_STOP=1 -f tests/pkg001/household_membership_acceptance.sql
          after_bp03_households=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "bp03_household_membership_schema_growth_bytes=$((after_bp03_households-before_bp03_households))"
          psql -v ON_ERROR_STOP=1 -f db/proposals/0030_bp04_business_text_id_naming.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0023_bp05_police_architecture.sql
          psql -v ON_ERROR_STOP=1 -f tests/pkg001/police_architecture_acceptance.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0024_bp06_personnel_service_records.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0025_bp07_career_rank_and_post_history.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0026_bp08_unit_deployment.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0027_bp09_police_resource_readiness.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0028_bp12_incident_management.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0029_bp12_command_handover.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0031_bp11_dispatch_lifecycle_writer.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0032_bp11_authorised_deployment_creation.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0033_bp06_opening_personnel_cohort.sql
          psql -v ON_ERROR_STOP=1 -f tests/pkg001/opening_personnel_cohort_acceptance.sql
          after_naming=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "sw_nam_001_database_bytes_before=$before_naming"
          echo "sw_nam_001_database_bytes_after=$after_naming"
          echo "sw_nam_001_schema_growth_bytes=$((after_naming-before_naming))"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname,pg_relation_size(format('%I.%I',schemaname,relname)) AS heap_bytes,pg_indexes_size(format('%I.%I',schemaname,relname)) AS index_bytes,pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes,(pg_total_relation_size(format('%I.%I',schemaname,relname))-pg_relation_size(format('%I.%I',schemaname,relname))-pg_indexes_size(format('%I.%I',schemaname,relname))) AS toast_and_aux_bytes FROM pg_stat_user_tables WHERE schemaname='sw_names' ORDER BY 4 DESC;"
          psql -v ON_ERROR_STOP=1 -f tests/pkg001/naming_acceptance.sql
          psql -v ON_ERROR_STOP=1 -c "SELECT relname,pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes FROM pg_stat_user_tables WHERE schemaname='sw_runtime' ORDER BY 2 DESC;"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname, pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes FROM pg_stat_user_tables WHERE schemaname='sw_runtime' ORDER BY 2 DESC;"
          after_schedule=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "bp37_schedule_schema_growth_bytes=$((after_schedule-before_schedule))"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname, pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes FROM pg_stat_user_tables WHERE schemaname='sw_runtime' ORDER BY 2 DESC;"
          after=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          delta=$((after-before))
          echo "pkg004_database_bytes_before_schema=$before"
          echo "pkg004_database_bytes_after_schema=$after"
          echo "pkg004_schema_growth_bytes=$delta"
          psql -v ON_ERROR_STOP=1 -c "SELECT schemaname,relname,pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes FROM pg_stat_user_tables WHERE schemaname='sw_player' ORDER BY 3 DESC;"
          psql -v ON_ERROR_STOP=1 -f tests/pkg001/auth_persistence_acceptance.sql
      - name: Run PKG-001 database acceptance checks
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/database_acceptance.sql
      - name: Materialise SW-GEO-V1 identity map in disposable PostgreSQL only
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/geography_identity_map_acceptance.sql
      - name: Run PKG-003 recruit-entry acceptance checks
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/recruit_entry_acceptance.sql
      - name: Verify BP06 personnel service dossier and supervisor links
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/personnel_service_acceptance.sql
      - name: Verify BP07 career history and recruit rank/post boundaries
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/career_history_acceptance.sql
      - name: Verify BP08 unit catalogue, establishment and readiness
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/unit_deployment_acceptance.sql
      - name: Verify BP11 dispatch lifecycle writer
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp11_dispatch_lifecycle_acceptance.sql
      - name: Verify BP11 authorised deployment creation
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp11_deployment_creation_acceptance.sql
      - name: Verify BP09 resource inventory and dispatch readiness
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/resource_readiness_acceptance.sql
      - name: Verify BP12 incident schema and runtime boundary
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/incident_management_acceptance.sql
      - name: Measure representative 1,000-person storage growth
        run: |
          before=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f tests/pkg001/storage_benchmark.sql
          after=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          delta=$((after-before))
          echo "database_bytes_before_fixture=$before"
          echo "database_bytes_after_fixture=$after"
          echo "database_growth_bytes=$delta"
          echo "database_growth_mb=$(awk -v d="$delta" 'BEGIN {printf "%.6f", d/1000000}')"
          echo "database_growth_mib=$(awk -v d="$delta" 'BEGIN {printf "%.6f", d/1048576}')"
          echo "approx_growth_bytes_per_person=$(awk -v d="$delta" 'BEGIN {printf "%.2f", d/1000}')"
          psql -v ON_ERROR_STOP=1 -c "SELECT schemaname, relname, pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes FROM pg_stat_user_tables WHERE schemaname IN ('sw_people','sw_core') ORDER BY 3 DESC;"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname,pg_relation_size(format('%I.%I',schemaname,relname)) AS heap_bytes,pg_indexes_size(format('%I.%I',schemaname,relname)) AS index_bytes,pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes,(pg_total_relation_size(format('%I.%I',schemaname,relname))-pg_relation_size(format('%I.%I',schemaname,relname))-pg_indexes_size(format('%I.%I',schemaname,relname))) AS toast_and_aux_bytes FROM pg_stat_user_tables WHERE schemaname='sw_names' ORDER BY 4 DESC;"
      - name: Install PostgreSQL Python driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run BP04 persistent business-name reservation acceptance (20,000 names)
        run: python -m unittest tests.pkg001.test_business_naming_postgres -v
      - name: Exercise NPC dispatch against canonical BP05 and BP08 records
        run: python -m unittest discover -s tests/pkg001 -p "test_postgres_npc_dispatch_integration.py" -v
      - name: Fast integrated database smoke check
        run: |
          psql -v ON_ERROR_STOP=1 -c "SELECT count(*) AS people FROM sw_people.person;"
          psql -v ON_ERROR_STOP=1 -c "SELECT to_regclass('sw_runtime.state') IS NOT NULL AS runtime_present, to_regclass('sw_names.name_reservation') IS NOT NULL AS naming_registry_present, to_regclass('sw_people.population_counter') IS NOT NULL AS population_counter_present;"
