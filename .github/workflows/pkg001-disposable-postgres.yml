name: PKG-001 disposable PostgreSQL validation

on:
  push:
    branches:
      - "main"
    paths:
      - "db/proposals/0002_runtime_city_population.sql"
      - "db/proposals/0003_actor_session_authorization.sql"
      - "db/proposals/0004_recruit_entry.sql"
      - "db/proposals/0005_player_identity_activation.sql"
      - "db/proposals/0006_bp37_tick_scheduling.sql"
      - "db/proposals/0007_bp35_event_dispatch.sql"
      - "db/proposals/0008_bp39_checkpoint_recovery.sql"
      - "db/proposals/0009_universal_name_registry.sql"
      - "runtime/naming.py"
      - "runtime/name_generation.py"
      - "runtime/naming_inventory.py"
      - "runtime/postgres_naming.py"
      - "tests/pkg001/test_postgres_naming.py"
      - "tests/pkg001/test_naming_inventory.py"
      - "tests/pkg001/test_naming.py"
      - "tests/pkg001/test_naming_postgres.py"
      - "tests/pkg001/naming_acceptance.sql"
      - "tests/pkg001/test_recruitment.py"
      - "tests/pkg001/recruit_entry_acceptance.sql"
      - "tests/pkg001/bp39_recovery_acceptance.sql"
      - "tests/pkg001/test_recovery.py"
      - "runtime/recovery.py"
      - "tests/pkg001/event_dispatch_acceptance.sql"
      - "tests/pkg001/test_event_engine.py"
      - "runtime/scheduling.py"
      - "tests/pkg001/test_scheduling.py"
      - "tests/pkg001/scheduling_acceptance.sql"
      - "docs/implementation/approval-packages/PKG-003-recruit-entry-vertical-slice.md"
      - "db/migrations/0001_foundation.sql"
      - "runtime/**"
      - "tests/pkg001/**"
      - ".github/workflows/pkg001-disposable-postgres.yml"
      - "db/proposals/0002_runtime_city_population.sql"
      - "db/migrations/0001_foundation.sql"
      - "runtime/**"
      - "tests/pkg001/**"
      - ".github/workflows/pkg001-disposable-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run runtime kernel tests
        run: python -m unittest discover -s tests/pkg001 -p "test_runtime_kernel.py" -v
      - name: Run player command interface tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_interface.py" -v
      - name: Run BP40-01 player workspace tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_workspace.py" -v
      - name: Run recruit-entry adapter tests
        run: python -m unittest discover -s tests/pkg001 -p "test_recruitment.py" -v
      - name: Run SW-NAM-001 naming service and generator tests
        run: python -m unittest discover -s tests/pkg001 -p "test_naming.py" -v
      - name: Run SW-NAM-001 canon inventory dry-run tests
        run: python -m unittest discover -s tests/pkg001 -p "test_naming_inventory.py" -v
      - name: Run SW-NAM-001 PostgreSQL adapter contract tests
        run: python -m unittest discover -s tests/pkg001 -p "test_postgres_naming.py" -v
      - name: Run accepted-player activation adapter tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_activation.py" -v
      - name: Run durable player application composition tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_application.py" -v
      - name: Run authenticated player command runtime tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_command_runtime.py" -v
      - name: Run trusted player host adapter tests
        run: python -m unittest discover -s tests/pkg001 -p "test_player_host_adapter.py" -v
      - name: Run ChatGPT tool handler contract tests
        run: python -m unittest discover -s tests/pkg001 -p "test_chatgpt_tool_handler.py" -v
      - name: Run BP37-01 tick scheduler tests
        run: python -m unittest discover -s tests/pkg001 -p "test_scheduling.py" -v
      - name: Run BP35-01 deterministic event engine tests
        run: python -m unittest discover -s tests/pkg001 -p "test_event_engine.py" -v
      - name: Run BP39-01 recovery contract tests
        run: python -m unittest discover -s tests/pkg001 -p "test_recovery.py" -v
      - name: Run actor authorization and hidden-truth gate tests
        run: python -m unittest discover -s tests/pkg001 -p "test_authorization.py" -v

  disposable-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_USER: saltwater_test
          POSTGRES_DB: saltwater_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saltwater_test -d saltwater_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: saltwater_test
      PGPASSWORD: test-only
      PGDATABASE: saltwater_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply foundation and PKG-001 to disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/0001_foundation.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0002_runtime_city_population.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0003_actor_session_authorization.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0004_recruit_entry.sql
          before=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0005_player_identity_activation.sql
          before_schedule=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0006_bp37_tick_scheduling.sql
          before_event_engine=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0007_bp35_event_dispatch.sql
          after_event_engine=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "bp35_event_dispatch_schema_growth_bytes=$((after_event_engine-before_event_engine))"
          before_recovery=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0008_bp39_checkpoint_recovery.sql
          after_recovery=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "bp39_checkpoint_recovery_schema_growth_bytes=$((after_recovery-before_recovery))"
          before_naming=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0009_universal_name_registry.sql
          after_naming=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "sw_nam_001_database_bytes_before=$before_naming"
          echo "sw_nam_001_database_bytes_after=$after_naming"
          echo "sw_nam_001_schema_growth_bytes=$((after_naming-before_naming))"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname,pg_relation_size(format('%I.%I',schemaname,relname)) AS heap_bytes,pg_indexes_size(format('%I.%I',schemaname,relname)) AS index_bytes,pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes,(pg_total_relation_size(format('%I.%I',schemaname,relname))-pg_relation_size(format('%I.%I',schemaname,relname))-pg_indexes_size(format('%I.%I',schemaname,relname))) AS toast_and_aux_bytes FROM pg_stat_user_tables WHERE schemaname='sw_names' ORDER BY 4 DESC;"
          psql -v ON_ERROR_STOP=1 -f tests/pkg001/naming_acceptance.sql
          psql -v ON_ERROR_STOP=1 -c "SELECT relname,pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes FROM pg_stat_user_tables WHERE schemaname='sw_runtime' ORDER BY 2 DESC;"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname, pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes FROM pg_stat_user_tables WHERE schemaname='sw_runtime' ORDER BY 2 DESC;"
          after_schedule=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "bp37_schedule_schema_growth_bytes=$((after_schedule-before_schedule))"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname, pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes FROM pg_stat_user_tables WHERE schemaname='sw_runtime' ORDER BY 2 DESC;"
          after=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          delta=$((after-before))
          echo "pkg004_database_bytes_before_schema=$before"
          echo "pkg004_database_bytes_after_schema=$after"
          echo "pkg004_schema_growth_bytes=$delta"
          psql -v ON_ERROR_STOP=1 -c "SELECT schemaname,relname,pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes FROM pg_stat_user_tables WHERE schemaname='sw_player' ORDER BY 3 DESC;"
          psql -v ON_ERROR_STOP=1 -f tests/pkg001/auth_persistence_acceptance.sql
      - name: Materialise SW-GEO-V1 identity map in disposable PostgreSQL only
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/geography_identity_map_acceptance.sql
      - name: Run PKG-001 database acceptance checks
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/database_acceptance.sql
      - name: Run PKG-003 recruit-entry acceptance checks
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/recruit_entry_acceptance.sql
      - name: Measure representative 1,000-person storage growth
        run: |
          before=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f tests/pkg001/storage_benchmark.sql
          after=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          delta=$((after-before))
          echo "database_bytes_before_fixture=$before"
          echo "database_bytes_after_fixture=$after"
          echo "database_growth_bytes=$delta"
          echo "database_growth_mb=$(awk -v d="$delta" 'BEGIN {printf "%.6f", d/1000000}')"
          echo "database_growth_mib=$(awk -v d="$delta" 'BEGIN {printf "%.6f", d/1048576}')"
          echo "approx_growth_bytes_per_person=$(awk -v d="$delta" 'BEGIN {printf "%.2f", d/1000}')"
          psql -v ON_ERROR_STOP=1 -c "SELECT schemaname, relname, pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes FROM pg_stat_user_tables WHERE schemaname IN ('sw_people','sw_core') ORDER BY 3 DESC;"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname,pg_relation_size(format('%I.%I',schemaname,relname)) AS heap_bytes,pg_indexes_size(format('%I.%I',schemaname,relname)) AS index_bytes,pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes,(pg_total_relation_size(format('%I.%I',schemaname,relname))-pg_relation_size(format('%I.%I',schemaname,relname))-pg_indexes_size(format('%I.%I',schemaname,relname))) AS toast_and_aux_bytes FROM pg_stat_user_tables WHERE schemaname='sw_names' ORDER BY 4 DESC;"
      - name: Install PostgreSQL Python driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Run SW-NAM-001 PostgreSQL concurrency and rollback tests
        run: python -m unittest discover -s tests/pkg001 -p "test_naming_postgres.py" -v
      - name: Test persistent session verifier and durable audit sink
        run: python -m unittest discover -s tests/pkg001 -p "test_postgres_security.py" -v
      - name: Restore disposable runtime to ready state for runtime adapter test
        run: psql -v ON_ERROR_STOP=1 -c "UPDATE sw_runtime.state SET state=1,player_present=false WHERE singleton=1 AND state=0;"
      - name: Run BP37-01 PostgreSQL schedule acceptance
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/scheduling_acceptance.sql
      - name: Run BP35-01 PostgreSQL event dispatch acceptance
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/event_dispatch_acceptance.sql
      - name: Run BP39-01 checkpoint and claim recovery acceptance
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp39_recovery_acceptance.sql
      - name: Test durable runtime adapter
        run: python -m unittest discover -s tests/pkg001 -p "test_postgres_runtime_store.py" -v
      - name: Test authenticated player command runtime end to end
        run: python -m unittest discover -s tests/pkg001 -p "test_player_command_runtime_postgres.py" -v
      - name: Fill disposable population to 9,999
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/population_cap_fixture.sql
      - name: Test concurrent population-cap boundary
        run: python -m unittest discover -s tests/pkg001 -p "test_population_concurrency.py" -v
      - name: Measure full 10,000-person disposable fixture
        run: |
          psql -v ON_ERROR_STOP=1 -c "SELECT pg_database_size(current_database()) AS database_bytes;"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname, pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes FROM pg_stat_user_tables WHERE schemaname IN ('sw_people','sw_core') ORDER BY 2 DESC;"
          psql -v ON_ERROR_STOP=1 -c "SELECT count(*) AS reserved_names,pg_total_relation_size('sw_names.name_reservation') AS reservation_total_bytes,round(pg_total_relation_size('sw_names.name_reservation')::numeric/NULLIF(count(*),0),2) AS total_bytes_per_reserved_name FROM sw_names.name_reservation;"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname,pg_relation_size(format('%I.%I',schemaname,relname)) AS heap_bytes,pg_indexes_size(format('%I.%I',schemaname,relname)) AS index_bytes,pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes,(pg_total_relation_size(format('%I.%I',schemaname,relname))-pg_relation_size(format('%I.%I',schemaname,relname))-pg_indexes_size(format('%I.%I',schemaname,relname))) AS toast_and_aux_bytes FROM pg_stat_user_tables WHERE schemaname='sw_names' ORDER BY 4 DESC;"
      - name: Test database access boundary
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/security_boundary.sql
      - name: Capture consistent BP39 checkpoint manifest
        id: bp39-checkpoint
        run: |
          checkpoint_id=$(psql -qAt -v ON_ERROR_STOP=1 -c "BEGIN; SET TRANSACTION ISOLATION LEVEL REPEATABLE READ; SELECT sw_runtime.capture_checkpoint_manifest('disposable-ci','saltwater','main','$PGDATABASE','ci:bp39','approval:BP39-01'); COMMIT;" | tail -n1)
          test -n "$checkpoint_id"
          echo "checkpoint_id=$checkpoint_id" >> "$GITHUB_OUTPUT"
          echo "BP39_CHECKPOINT_ID=$checkpoint_id"
      - name: Backup and restore disposable database
        env:
          BP39_CHECKPOINT_ID: ${{ steps.bp39-checkpoint.outputs.checkpoint_id }}
        run: |
          cid=$(docker ps -q --filter ancestor=postgres:16 | head -n1)
          test -n "$cid"
          expected=$(docker exec "$cid" psql -U "$PGUSER" -d "$PGDATABASE" -Atc "SELECT (SELECT count(*) FROM sw_people.person)||':'||(SELECT count(*) FROM sw_people.population_state)||':'||(SELECT count(*) FROM sw_people.population_history)||':'||(SELECT count(*) FROM sw_people.profile_history)||':'||(SELECT count(*) FROM sw_core.simulation_event)||':'||(SELECT max(event_id) FROM sw_core.simulation_event)||':'||(SELECT world_tick FROM sw_runtime.state WHERE singleton=1)||':'||(SELECT living_included FROM sw_people.population_counter WHERE singleton=1)||':'||(SELECT count(*) FROM sw_names.name_reservation)||':'||(SELECT count(*) FROM sw_names.name_event)||':'||(SELECT count(*) FROM sw_names.generation_batch)")
          docker exec "$cid" pg_dump -U "$PGUSER" -d "$PGDATABASE" -Fc -f /tmp/saltwater-pkg001.dump
          docker exec "$cid" createdb -U "$PGUSER" saltwater_restore
          docker exec "$cid" pg_restore -U "$PGUSER" --exit-on-error --no-owner -d saltwater_restore /tmp/saltwater-pkg001.dump
          docker exec -i "$cid" psql -U "$PGUSER" -d saltwater_restore -v ON_ERROR_STOP=1 < tests/pkg001/backup_restore_assert.sql
          actual=$(docker exec "$cid" psql -U "$PGUSER" -d saltwater_restore -Atc "SELECT (SELECT count(*) FROM sw_people.person)||':'||(SELECT count(*) FROM sw_people.population_state)||':'||(SELECT count(*) FROM sw_people.population_history)||':'||(SELECT count(*) FROM sw_people.profile_history)||':'||(SELECT count(*) FROM sw_core.simulation_event)||':'||(SELECT max(event_id) FROM sw_core.simulation_event)||':'||(SELECT world_tick FROM sw_runtime.state WHERE singleton=1)||':'||(SELECT living_included FROM sw_people.population_counter WHERE singleton=1)||':'||(SELECT count(*) FROM sw_names.name_reservation)||':'||(SELECT count(*) FROM sw_names.name_event)||':'||(SELECT count(*) FROM sw_names.generation_batch)")
          test "$expected" = "$actual"
          echo "BACKUP_RESTORE_MANIFEST_MATCH=$actual"
          restore_report=$(docker exec "$cid" psql -U "$PGUSER" -d saltwater_restore -Atc "SELECT sw_runtime.validate_checkpoint_manifest('$BP39_CHECKPOINT_ID');")
          echo "BP39_RESTORE_VALIDATION=$restore_report"
          echo "$restore_report" | jq -e '.valid == false and .gates.schema_watermark.status == "pass" and .gates.runtime_and_tick.status == "pass" and .gates.event_watermark.status == "pass" and .gates.event_work.status == "pass" and .gates.schedules.status == "pass" and .gates.population_cap.status == "pass" and .gates.manifest_identity.status == "pass" and .gates.structural_integrity.status == "pass" and .gates.append_only_history.status == "pass" and .gates.player_absence_freeze.status == "not_executed" and .gates.permission_hidden_truth.status == "not_executed"'
