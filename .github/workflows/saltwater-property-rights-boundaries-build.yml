name: Saltwater Property Rights and Boundaries Build
on:
  push:
    branches: [main]
    paths:
      - "runtime/property_rights_boundaries_generator.py"
      - "runtime/property_tenure_generator.py"
      - "runtime/property_world_generator.py"
      - "data/property/saltwater-property-world-v1.json"
      - "data/property/saltwater-property-tenure-v1.json"
      - "data/property/saltwater-property-lifecycle-transactions-v1.json"
      - "data/property/saltwater-building-services-v1.json"
      - "data/property/saltwater-property-security-access-v1.json"
      - "tests/pkg001/test_property_rights_boundaries_generator.py"
      - ".github/workflows/saltwater-property-rights-boundaries-build.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saltwater-property-rights-boundaries-main
  cancel-in-progress: true
jobs:
  build-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic geometry dependency
        run: python -m pip install "shapely==2.1.2"
      - name: Generate property rights and boundary evidence
        run: python -m runtime.property_rights_boundaries_generator
      - name: Run property rights regression tests
        run: python -m unittest discover -s tests/pkg001 -p "test_property_rights_boundaries_generator.py" -v
      - name: Persist compact property rights dataset on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/property/saltwater-property-rights-boundaries-v1.json
          if git diff --cached --quiet; then
            echo "Property rights dataset is unchanged."
            exit 0
          fi
          git commit -m "Generate Saltwater property rights and boundary registers"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
