name: BP04 complete property source inventory

on:
  push:
    branches: [main]
    paths:
      - "data/property/**"
      - "data/business/**"
      - "runtime/bp04_source_inventory.py"
      - "tests/pkg001/test_bp04_source_inventory.py"
      - ".github/workflows/bp04-source-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source inventory logic
        run: python -m unittest tests.pkg001.test_bp04_source_inventory -v
      - name: Inventory all compressed source collections
        run: |
          python runtime/bp04_source_inventory.py --output /tmp/bp04-source-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/bp04-source-inventory.json").read_text())
          assert data["dataset_count"] == 14, data["dataset_count"]
          assert data["collection_count"] > 0
          assert data["record_count"] > 0
          print(json.dumps({k: data[k] for k in ("dataset_count", "collection_count", "record_count", "compressed_bytes", "uncompressed_bytes")}, indent=2))
          for dataset in data["datasets"]:
              print(f'{dataset["dataset_id"]}: {dataset["collection_count"]} collections, {dataset["record_count"]} records')
          PY
