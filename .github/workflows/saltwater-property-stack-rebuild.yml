name: Saltwater Property Stack Sequential Rebuild
on:
  push:
    branches: [main]
    paths:
      - "runtime/property_stack_rebuild.py"
      - "data/property/saltwater-property-world-v1.json.gz"
      - ".github/workflows/saltwater-property-stack-rebuild.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saltwater-property-stack-main
  cancel-in-progress: true
jobs:
  rebuild-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned geometry dependency
        run: python -m pip install "shapely==2.1.2"
      - name: Restore compressed canonical snapshot for rebuild inputs
        run: |
          if [ -f data/property/saltwater-property-world-v1.json.gz ]; then
            gzip -t data/property/saltwater-property-world-v1.json.gz
            gzip -dc data/property/saltwater-property-world-v1.json.gz > data/property/saltwater-property-world-v1.json
          fi
      - name: Rebuild all property and business datasets in dependency order
        run: python -m runtime.property_stack_rebuild
      - name: Validate physical asset inventory
        run: python -m unittest discover -s tests/pkg001 -p "test_physical_asset_inventory_generator.py" -v
      - name: Validate canonical property world
        run: python -m unittest discover -s tests/pkg001 -p "test_property_world_generator.py" -v
      - name: Validate business registry and operations
        run: |
          python -m unittest discover -s tests/pkg001 -p "test_business_registry_generator.py" -v
          python -m unittest discover -s tests/pkg001 -p "test_business_operations_generator.py" -v
      - name: Validate property ownership and utilities
        run: |
          python -m unittest discover -s tests/pkg001 -p "test_property_tenure_generator.py" -v
          python -m unittest discover -s tests/pkg001 -p "test_building_services_generator.py" -v
      - name: Validate maintenance, security and valuation
        run: |
          python -m unittest discover -s tests/pkg001 -p "test_property_maintenance_generator.py" -v
          python -m unittest discover -s tests/pkg001 -p "test_property_security_access_generator.py" -v
          python -m unittest discover -s tests/pkg001 -p "test_property_value_risk_tax_generator.py" -v
      - name: Validate development, lifecycle and rights
        run: |
          python -m unittest discover -s tests/pkg001 -p "test_property_development_control_generator.py" -v
          python -m unittest discover -s tests/pkg001 -p "test_property_lifecycle_transactions_generator.py" -v
          python -m unittest discover -s tests/pkg001 -p "test_property_rights_boundaries_generator.py" -v
      - name: Validate insurance, facilities and estate audit
        run: |
          python -m unittest discover -s tests/pkg001 -p "test_property_insurance_claims_generator.py" -v
          python -m unittest discover -s tests/pkg001 -p "test_property_facilities_operations_generator.py" -v
          python -m unittest discover -s tests/pkg001 -p "test_global_estate_capacity_audit.py" -v
      - name: Compress canonical property world snapshot
        run: |
          gzip -9 -n -c data/property/saltwater-property-world-v1.json > data/property/saltwater-property-world-v1.json.gz
          gzip -t data/property/saltwater-property-world-v1.json.gz
          sha256sum data/property/saltwater-property-world-v1.json.gz
          rm data/property/saltwater-property-world-v1.json
      - name: Persist one consistent property stack snapshot on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/property/saltwater-property-world-v1.json.gz \
            data/business/saltwater-business-registry-v1.json \
            data/business/saltwater-business-operations-v1.json \
            data/property/saltwater-property-tenure-v1.json \
            data/property/saltwater-building-services-v1.json \
            data/property/saltwater-property-maintenance-v1.json \
            data/property/saltwater-property-security-access-v1.json \
            data/property/saltwater-property-value-risk-tax-v1.json \
            data/property/saltwater-property-development-control-v1.json \
            data/property/saltwater-property-lifecycle-transactions-v1.json \
            data/property/saltwater-property-rights-boundaries-v1.json \
            data/property/saltwater-property-insurance-claims-v1.json \
            data/property/saltwater-property-facilities-operations-v1.json \
            data/property/saltwater-global-estate-capacity-audit-v1.json
          git rm --ignore-unmatch data/property/saltwater-property-world-v1.json
          if git diff --cached --quiet; then
            echo "All property stack datasets are already current."
            exit 0
          fi
          git commit -m "Rebuild expanded Saltwater property and business stack"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
