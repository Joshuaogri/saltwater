name: BP03 Individual Simulation Acceptance

on:
  push:
    branches: [main]
    paths:
      - 'db/proposals/0036_bp03_individual_simulation_promotion.sql'
      - 'tests/pkg001/bp03_individual_simulation_acceptance.sql'
      - 'db/proposals/0037_bp03_person_routines_and_movement.sql'
      - 'tests/pkg001/bp03_person_routines_movement_acceptance.sql'
      - 'db/proposals/0038_bp03_person_knowledge_boundary.sql'
      - 'tests/pkg001/bp03_person_knowledge_acceptance.sql'
      - 'db/proposals/0039_bp03_person_attribute_claims.sql'
      - 'tests/pkg001/bp03_person_attribute_claims_acceptance.sql'
      - 'tests/pkg001/population_cap_fixture.sql'
      - 'tests/pkg001/test_population_concurrency.py'
      - '.github/workflows/bp03-individual-simulation-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_USER: saltwater_test
          POSTGRES_DB: saltwater_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saltwater_test -d saltwater_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: saltwater_test
      PGPASSWORD: test-only
      PGDATABASE: saltwater_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical person foundation and naming
        run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/0001_foundation.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0002_runtime_city_population.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0009_universal_name_registry.sql
          psql -v ON_ERROR_STOP=1 -f db/proposals/0010_bp03_population_qualification_union.sql
      - name: Apply BP03 individual simulation tier and promotion service
        run: |
          before=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          psql -v ON_ERROR_STOP=1 -f db/proposals/0036_bp03_individual_simulation_promotion.sql
          after=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT pg_database_size(current_database());")
          echo "bp03_individual_simulation_schema_growth_bytes=$((after-before))"
      - name: Verify tier progression, permanent promotion and history
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp03_individual_simulation_acceptance.sql
      - name: Apply BP03 routines and movement service
        run: psql -v ON_ERROR_STOP=1 -f db/proposals/0037_bp03_person_routines_and_movement.sql
      - name: Verify routine, movement, certainty and chronology boundaries
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp03_person_routines_movement_acceptance.sql
      - name: Apply BP03 person knowledge boundary
        run: psql -v ON_ERROR_STOP=1 -f db/proposals/0038_bp03_person_knowledge_boundary.sql
      - name: Verify sourced knowledge and immutable information history
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp03_person_knowledge_acceptance.sql
      - name: Apply BP03 person attribute claims
        run: psql -v ON_ERROR_STOP=1 -f db/proposals/0039_bp03_person_attribute_claims.sql
      - name: Verify sourced and conflicting person attribute claims
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/bp03_person_attribute_claims_acceptance.sql
      - name: Fill disposable BP03 population to 9,999
        timeout-minutes: 20
        run: psql -v ON_ERROR_STOP=1 -f tests/pkg001/population_cap_fixture.sql
      - name: Install PostgreSQL Python driver for concurrent admission
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Verify the concurrent 9,999-to-10,000 population boundary
        timeout-minutes: 10
        run: python -m unittest discover -s tests/pkg001 -p "test_population_concurrency.py" -v
      - name: Measure complete 10,000-person BP03 fixture
        run: |
          psql -v ON_ERROR_STOP=1 -c "SELECT pg_database_size(current_database()) AS database_bytes;"
          psql -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM sw_people.person) AS canonical_people,(SELECT count(*) FROM sw_people.population_state WHERE life_status=1 AND scope_status=1) AS included_population,(SELECT count(*) FROM sw_people.person_simulation_state) AS tier_states,(SELECT count(*) FROM sw_people.person_simulation_history) AS tier_history,(SELECT living_included FROM sw_people.population_counter WHERE singleton=1) AS population_counter;"
          psql -v ON_ERROR_STOP=1 -c "SELECT relname,pg_total_relation_size(format('%I.%I',schemaname,relname)) AS total_bytes FROM pg_stat_user_tables WHERE schemaname='sw_people' ORDER BY 2 DESC;"
