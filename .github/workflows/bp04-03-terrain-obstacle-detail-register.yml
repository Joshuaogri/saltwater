name: BP04-03 Terrain and Physical Obstacle Detail Register
on:
  push:
    branches: [main]
    paths:
      - "data/geography/saltwater-geography-v1.json"
      - "runtime/terrain_obstacle_detail_register.py"
      - "runtime/building_access_route_corridor_audit.py"
      - "runtime/road_corridor_audit.py"
      - "runtime/parcel_candidate_generator.py"
      - "runtime/parcel_dossier_generator.py"
      - "runtime/physical_asset_inventory_generator.py"
      - "tests/pkg001/test_terrain_obstacle_detail_register.py"
      - ".github/workflows/bp04-03-terrain-obstacle-detail-register.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terrain-obstacle-detail-register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned geometry engine
        run: python -m pip install "shapely==2.1.2"
      - name: Run detail-register regression tests
        run: python -m unittest discover -s tests/pkg001 -p "test_terrain_obstacle_detail_register.py" -v
      - name: Generate terrain and obstacle detail register
        run: python -m runtime.terrain_obstacle_detail_register
      - name: Upload read-only detail register
        uses: actions/upload-artifact@v4
        with:
          name: bp04-03-terrain-obstacle-detail-register
          path: bp04-03-terrain-obstacle-detail-register.json
          if-no-files-found: error
          retention-days: 14
