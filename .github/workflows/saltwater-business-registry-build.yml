name: Saltwater 10,000 Business Registry Build
on:
  push:
    branches: [main]
    paths:
      - "runtime/business_registry_generator.py"
      - "runtime/property_world_generator.py"
      - "runtime/physical_asset_inventory_generator.py"
      - "runtime/parcel_candidate_generator.py"
      - "runtime/parcel_dossier_generator.py"
      - "runtime/road_corridor_audit.py"
      - "runtime/road_reserve_topology.py"
      - "data/geography/saltwater-geography-v1.json"
      - "tests/pkg001/test_business_registry_generator.py"
      - ".github/workflows/saltwater-business-registry-build.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saltwater-business-registry-main
  cancel-in-progress: true
jobs:
  build-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic geometry dependency
        run: python -m pip install "shapely==2.1.2"
      - name: Generate 10,000-business registry
        run: python -m runtime.business_registry_generator
      - name: Run business registry regression tests
        run: python -m unittest discover -s tests/pkg001 -p "test_business_registry_generator.py" -v
      - name: Persist textual registry on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/business/saltwater-business-registry-v1.json
          if git diff --cached --quiet; then
            echo "Business registry is unchanged."
            exit 0
          fi
          git commit -m "Generate Saltwater 10,000-business registry"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
