name: Saltwater Property Lifecycle and Transactions Build
on:
  push:
    branches: [main]
    paths:
      - "runtime/property_lifecycle_transactions_generator.py"
      - "runtime/property_tenure_generator.py"
      - "runtime/property_world_generator.py"
      - "data/property/saltwater-property-world-v1.json"
      - "data/property/saltwater-property-world-v1.json.gz"
      - "data/property/saltwater-property-world-v1.json.gz"
      - "data/property/saltwater-property-tenure-v1.json"
      - "data/property/saltwater-property-tenure-v1.json.gz"
      - "data/property/saltwater-property-tenure-v1.json.gz"
      - "data/property/saltwater-property-development-control-v1.json"
      - "data/property/saltwater-property-development-control-v1.json.gz"
      - "data/property/saltwater-property-development-control-v1.json.gz"
      - "tests/pkg001/test_property_lifecycle_transactions_generator.py"
      - ".github/workflows/saltwater-property-lifecycle-transactions-build.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saltwater-property-lifecycle-transactions-main
  cancel-in-progress: true
jobs:
  build-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic geometry dependency
        run: python -m pip install "shapely==2.1.2"
      - name: Generate title, transaction and lifecycle records
        run: python -m runtime.property_lifecycle_transactions_generator
      - name: Run lifecycle regression tests
        run: python -m unittest discover -s tests/pkg001 -p "test_property_lifecycle_transactions_generator.py" -v
      - name: Persist compact lifecycle dataset on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/property/saltwater-property-lifecycle-transactions-v1.json
          if git diff --cached --quiet; then
            echo "Property lifecycle dataset is unchanged."
            exit 0
          fi
          git commit -m "Generate Saltwater property title and lifecycle records"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Unable to publish generated data after six main-branch retries." >&2
              exit 1
            fi
            sleep "$attempt"
          done
